<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Día de Muertos y Halloween</title>
<meta name="description" content="Libro para colorear gratis: 20 dibujos de Día de Muertos y Halloween para imprimir. Por Jairo Guizar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4e6;--ink:#2a2420;--muted:#776c62;--acc:#e2621b;--acc2:#2e9c8a;--line:#efe2cf}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
.portada{text-align:center;padding:36px 16px 20px;max-width:760px;margin:auto}
.portada h1{font:800 clamp(2.2rem,8vw,3.6rem)/1 "Baloo 2",system-ui;margin:0;color:var(--acc)}
.portada p{margin:10px 0 0;color:var(--muted);font-size:1.05rem}
.autor{font-weight:700;color:var(--acc2)}
.acciones{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0 6px}
.acciones button,.acciones a{border:0;border-radius:999px;padding:12px 20px;font:700 1rem Nunito,system-ui;cursor:pointer;text-decoration:none}
.imprimir{background:var(--acc);color:#fff}
.tienda{background:#fff;color:var(--ink);border:2px solid var(--line)!important}
.nota{font-size:.88rem;color:var(--muted);max-width:520px;margin:6px auto 0}
.paginas{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;max-width:960px;margin:20px auto 50px;padding:0 16px}
.pagina{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:zoom-in}
.pagina img{width:100%;aspect-ratio:1;object-fit:contain;display:block;background:#fff}
.pagina .pie{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font-size:.85rem;border-top:1px solid var(--line)}
.pagina .pie b{color:var(--acc2)}
.pagina .pie button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font:700 .78rem Nunito;cursor:pointer}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:0 16px 30px}
#visor{position:fixed;inset:0;background:rgba(30,20,10,.88);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#visor img{max-width:100%;max-height:100%;background:#fff;border-radius:10px}
.hoja{display:none}
@media print{
  @page{size:letter;margin:12mm}
  body{background:#fff}
  .portada,.paginas,footer,#visor{display:none!important}
  .hoja{display:flex!important;flex-direction:column;align-items:center;justify-content:center;height:250mm;page-break-after:always;break-after:page}
  .hoja img{max-width:100%;max-height:220mm}
  .hoja .t{font:800 20pt "Baloo 2",sans-serif;margin-bottom:6mm}
  .hoja .c{font:9pt Nunito,sans-serif;color:#666;margin-top:6mm}
  body.una .hoja{display:none!important}
  body.una .hoja.sel{display:flex!important}
  .hoja.portadaimp .t{font-size:40pt;color:#f26b3a}
}
</style>
</head>
<body>
<header class="portada">
  <h1>Día de Muertos y Halloween</h1>
  <p>Libro para colorear · 20 dibujos gratis para imprimir</p>
  <p>por <span class="autor">Jairo Guizar</span></p>
  <div class="acciones">
    <button class="imprimir" id="todo">🖨️ Imprimir o guardar PDF</button>
    <a class="tienda" href="../" id="tiendaLink">🛍️ Ver mi tienda</a>
  </div>
  <p class="nota">Toca un dibujo para verlo grande. En “Imprimir” elige <b>Guardar como PDF</b> si no tienes impresora.</p>
</header>

<main class="paginas" id="paginas"></main>
<div id="hojas"></div>
<footer>© 2026 Jairo Guizar · Uso personal y escolar gratuito</footer>
<div id="visor"><img alt=""></div>

<script>
const BASE = "";
const PAGINAS = [{"titulo": "La calaverita sonriente", "ruta": "https://pnjglzuxsyahxcbgjwvq.supabase.co/storage/v1/object/public/archivos/imagenes/dia-de-muertos-y-halloween/1791759377757-colorear.jpg"}, {"titulo": "La flor de cempasúchil", "ruta": "https://pnjglzuxsyahxcbgjwvq.supabase.co/storage/v1/object/public/archivos/imagenes/dia-de-muertos-y-halloween/1791759431080-colorear.jpg"}, {"titulo": "El pan de muerto", "ruta": "https://pnjglzuxsyahxcbgjwvq.supabase.co/storage/v1/object/public/archivos/imagenes/dia-de-muertos-y-halloween/1791759445243-colorear.jpg"}, {"titulo": "El perrito xoloitzcuintle", "ruta": "https://pnjglzuxsyahxcbgjwvq.supabase.co/storage/v1/object/public/archivos/imagenes/dia-de-muertos-y-halloween/1791759483616-colorear.jpg"}, {"titulo": "El alebrije gatito", "ruta": "https://pnjglzuxsyahxcbgjwvq.supabase.co/storage/v1/object/public/archivos/imagenes/dia-de-muertos-y-halloween/1791759483265-colorear.jpg"}, {"titulo": "La vela y las flores", "ruta": "https://pnjglzuxsyahxcbgjwvq.supabase.co/storage/v1/object/public/archivos/imagenes/dia-de-muertos-y-halloween/1791759550698-colorear.jpg"}, {"titulo": "La mariposa monarca", "ruta": "https://pnjglzuxsyahxcbgjwvq.supabase.co/storage/v1/object/public/archivos/imagenes/dia-de-muertos-y-halloween/1791759544753-colorear.jpg"}, {"titulo": "La catrinita", "ruta": "https://pnjglzuxsyahxcbgjwvq.supabase.co/storage/v1/object/public/archivos/imagenes/dia-de-muertos-y-halloween/1791759614905-colorear.jpg"}, {"titulo": "El esqueletito bailarín", "ruta": "https://pnjglzuxsyahxcbgjwvq.supabase.co/storage/v1/object/public/archivos/imagenes/dia-de-muertos-y-halloween/1791759673604-colorear.jpg"}, {"titulo": "La guitarra con flores", "ruta": "https://pnjglzuxsyahxcbgjwvq.supabase.co/storage/v1/object/public/archivos/imagenes/dia-de-muertos-y-halloween/1791759667330-colorear.jpg"}, {"titulo": "La calabaza sonriente", "ruta": "https://pnjglzuxsyahxcbgjwvq.supabase.co/storage/v1/object/public/archivos/imagenes/dia-de-muertos-y-halloween/1791759739719-colorear.jpg"}, {"titulo": "El fantasmita amigable", "ruta": "https://pnjglzuxsyahxcbgjwvq.supabase.co/storage/v1/object/public/archivos/imagenes/dia-de-muertos-y-halloween/1791759732533-colorear.jpg"}, {"titulo": "El gatito con sombrero de bruja", "ruta": "https://res.cloudinary.com/dgdw8fbku/image/upload/v1791765022/ediciones-guizar/dia-de-muertos/13-gatito-bruja.jpg"}, {"titulo": "El murcielaguito", "ruta": "https://res.cloudinary.com/dgdw8fbku/image/upload/v1791765034/ediciones-guizar/dia-de-muertos/14-murcielaguito.jpg"}, {"titulo": "El búho brujito", "ruta": "https://res.cloudinary.com/dgdw8fbku/image/upload/v1791765042/ediciones-guizar/dia-de-muertos/15-buho-brujito.jpg"}, {"titulo": "La calabaza con dulces", "ruta": "https://res.cloudinary.com/dgdw8fbku/image/upload/v1791765048/ediciones-guizar/dia-de-muertos/16-calabaza-dulces.jpg"}, {"titulo": "La arañita simpática", "ruta": "https://res.cloudinary.com/dgdw8fbku/image/upload/v1791765054/ediciones-guizar/dia-de-muertos/17-aranita.jpg"}, {"titulo": "El caldero mágico", "ruta": "https://res.cloudinary.com/dgdw8fbku/image/upload/v1791765062/ediciones-guizar/dia-de-muertos/18-caldero.jpg"}, {"titulo": "El monstruito tierno", "ruta": "https://res.cloudinary.com/dgdw8fbku/image/upload/v1791765069/ediciones-guizar/dia-de-muertos/19-monstruito.jpg"}, {"titulo": "La escoba voladora", "ruta": "https://res.cloudinary.com/dgdw8fbku/image/upload/v1791765078/ediciones-guizar/dia-de-muertos/20-escoba.jpg"}];
const $ = (s) => document.querySelector(s);

function hoja(p, i, extra) {
  const h = document.createElement("section");
  h.className = "hoja" + (extra ? " " + extra : "");
  h.innerHTML = `<div class="t"></div><img alt=""><div class="c">Día de Muertos y Halloween · © Jairo Guizar</div>`;
  h.querySelector(".t").textContent = p.titulo;
  h.querySelector("img").src = BASE + p.ruta;
  h.querySelector("img").alt = p.titulo;
  h.dataset.i = i;
  return h;
}

// Hoja de portada impresa
const portadaImp = document.createElement("section");
portadaImp.className = "hoja portadaimp";
portadaImp.innerHTML = `<div class="t">Día de Muertos y Halloween</div><div class="c" style="font-size:14pt">Libro para colorear · por Jairo Guizar</div><div class="c" style="margin-top:20mm">Este libro pertenece a: ______________________</div>`;
$("#hojas").appendChild(portadaImp);

PAGINAS.forEach((p, i) => {
  const el = document.createElement("article");
  el.className = "pagina";
  el.innerHTML = `<img loading="lazy" alt=""><div class="pie"><span><b>${i + 1}.</b> <span class="nom"></span></span><button>Imprimir</button></div>`;
  el.querySelector("img").src = BASE + p.ruta;
  el.querySelector("img").alt = p.titulo;
  el.querySelector(".nom").textContent = p.titulo;
  el.querySelector("img").onclick = () => { $("#visor img").src = BASE + p.ruta; $("#visor").style.display = "flex"; };
  el.querySelector("button").onclick = () => {
    document.querySelectorAll(".hoja").forEach((h) => h.classList.toggle("sel", h.dataset.i === String(i)));
    document.body.classList.add("una"); print(); document.body.classList.remove("una");
  };
  $("#paginas").appendChild(el);
  $("#hojas").appendChild(hoja(p, i));
});

$("#todo").onclick = () => { document.body.classList.remove("una"); print(); };
$("#visor").onclick = () => ($("#visor").style.display = "none");
</script>
</body>
</html>
