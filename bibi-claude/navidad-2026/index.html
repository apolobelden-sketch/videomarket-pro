<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuentos de Navidad 2026 · Ediciones Guizar (revisión)</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--rojo:#c8102e;--verde:#14532d;--oro:#e8b923;--papel:#fffaf0;--tinta:#2b1d14}
*{box-sizing:border-box}body{margin:0;background:#f3ead8;color:var(--tinta);font:17px/1.7 Nunito,system-ui,sans-serif}
.barra{position:sticky;top:0;z-index:2;background:var(--verde);color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
.barra b{color:var(--oro)}.barra button{background:var(--oro);border:0;border-radius:8px;padding:8px 12px;font-weight:700;font-size:14px}
.portada{min-height:92vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;background:radial-gradient(circle at 50% 30%,#1f6b3d,#0d3b20);color:#fff}
.portada h1{font:700 clamp(36px,9vw,64px)/1.05 Fredoka,sans-serif;margin:16px 0 8px;color:var(--oro)}
.portada p{margin:4px 0;font-size:18px}.estrella{font-size:72px}
.indice{max-width:720px;margin:0 auto;padding:30px 20px}
.indice li{margin:8px 0}.indice a{color:var(--rojo);font-weight:700}
.cuento{max-width:720px;margin:24px auto;background:var(--papel);border-radius:18px;padding:36px 28px;box-shadow:0 6px 24px #0002;border-top:10px solid var(--rojo)}
.cuento h1,.cuento h2{font:700 30px/1.15 Fredoka,sans-serif;color:var(--rojo);margin:0 0 14px}
.cuento h3{font:700 22px Fredoka,sans-serif;color:var(--verde)}
.espera{color:#7a6a58;font-style:italic;text-align:center}
.estado{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;background:#fde68a;margin-bottom:10px}
.estado.ok{background:#bbf7d0}
footer{text-align:center;padding:30px;font-size:14px;color:#7a6a58}
@media print{.barra{display:none}.cuento{box-shadow:none;page-break-before:always;border-radius:0}.portada{min-height:100vh}body{background:#fff}}
</style>
</head>
<body>
<div class="barra"><span>📖 <b>Versión de revisión</b> · aún no está a la venta</span><span id="avance"></span><button onclick="window.print()">Guardar como PDF</button></div>
<section class="portada">
  <div class="estrella">⭐</div>
  <h1>Cuentos de Navidad</h1>
  <p>Cinco historias para leer en familia</p>
  <p style="opacity:.8">Ediciones Guizar · 2026</p>
</section>
<section class="indice"><h2>Contenido</h2><ol id="indice"></ol></section>
<main id="libro"></main>
<footer>Textos: Bibi · Armado: Claude · Aprobación final: Jairo Guizar</footer>
<script>
{
const N = 5;
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
function md(t) {
  return t.split(/\n{2,}/).map((b) => {
    b = b.trim(); if (!b) return "";
    const h = b.match(/^(#{1,3})\s+(.*)$/);
    const inl = (x) => esc(x).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>").replace(/\n/g, "<br>");
    if (h) return `<h${h[1].length}>${inl(h[2])}</h${h[1].length}>`;
    return `<p>${inl(b)}</p>`;
  }).join("");
}
async function cargar() {
  let listos = 0; const ind = [], cuerpo = [];
  for (let i = 1; i <= N; i++) {
    let html, titulo = `Cuento ${i}`;
    try {
      const r = await fetch(`cuento-${i}.md?v=${Date.now()}`);
      if (!r.ok) throw 0;
      const t = await r.text(); listos++;
      const m = t.match(/^#\s+(.+)$/m); if (m) titulo = m[1].trim();
      html = `<span class="estado ok">Listo para revisar</span>` + md(t);
    } catch { html = `<span class="estado">En espera</span><h2>Cuento ${i}</h2><p class="espera">Bibi todavía no sube este cuento.</p>`; }
    ind.push(`<li><a href="#c${i}">${esc(titulo)}</a></li>`);
    cuerpo.push(`<article class="cuento" id="c${i}">${html}</article>`);
  }
  document.getElementById("indice").innerHTML = ind.join("");
  document.getElementById("libro").innerHTML = cuerpo.join("");
  document.getElementById("avance").textContent = `${listos} de ${N} cuentos listos`;
}
cargar();
}
</script>
</body>
</html>
