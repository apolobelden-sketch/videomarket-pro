<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escucha y lee · Ediciones Guizar</title>
<meta name="description" content="Audiolibros de Ediciones Guizar: escucha el cuento con cada palabra iluminada y luego léelo tú en voz alta.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8ec;--ink:#2a2430;--muted:#776c80;--c1:#6a1b9a;--c2:#ef6c00;--rojo:#d32f2f;--verde:#2e7d32;--line:#eadff0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
header{background:linear-gradient(160deg,var(--c1),var(--c2));color:#fff;text-align:center;padding:14px 16px}
header a{color:#fff;text-decoration:none;font:800 1rem "Baloo 2",system-ui}
main{max-width:720px;margin:auto;padding:16px 16px 40px}
h1{font:800 clamp(1.7rem,7vw,2.6rem)/1.25 "Baloo 2",system-ui;text-align:center;margin:8px 0 12px}
.dibujo{background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px}
.dibujo img{width:100%;display:block;border-radius:10px}
.controles{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px}
.modos{display:flex;gap:8px;margin-bottom:10px}
.modos button{flex:1;border:2px solid var(--line);background:#fff;border-radius:14px;padding:9px 6px;font:800 1rem "Baloo 2",system-ui;color:var(--ink);cursor:pointer}
.modos button.on{border-color:var(--c2);background:#fff3e0}
.play{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;border:0;border-radius:999px;padding:15px;background:var(--c2);color:#fff;font:800 1.3rem "Baloo 2",system-ui;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.play.mic{background:var(--verde)}
.play.mic.escuchando{background:var(--rojo);animation:latido 1.2s infinite}
@keyframes latido{50%{box-shadow:0 0 0 10px rgba(211,47,47,.15)}}
.play svg{width:28px;height:28px;fill:#fff}
.barra{height:8px;background:#f1e4d6;border-radius:99px;overflow:hidden;margin-top:10px}
.barra div{height:100%;width:0;background:var(--rojo)}
.vel{display:flex;justify-content:center;gap:8px;margin-top:8px;font-size:.9rem;color:var(--muted)}
.vel button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font:700 .9rem Nunito,system-ui;color:var(--ink);cursor:pointer}
.vel button.on{background:var(--c1);color:#fff;border-color:var(--c1)}
.texto p{font-size:1.4rem;line-height:2.15;margin:0 0 14px;word-spacing:.22em}
.w{display:inline-block;transition:transform .12s ease,color .12s ease,background-color .12s ease;border-radius:6px;padding:0 .08em;cursor:pointer;transform-origin:50% 70%}
.w.leida{color:var(--rojo)}
.w.ahora{color:#fff;background:var(--rojo);transform:scale(1.22);position:relative;z-index:2;box-shadow:0 3px 10px rgba(211,47,47,.35)}
h1 .w.ahora{transform:scale(1.12)}
.w.bien{color:var(--verde)}
.w.saltada{color:#ef6c00;text-decoration:underline wavy #ef6c00}
.w.sigue{background:#fff59d;outline:2px dashed var(--verde);outline-offset:2px}
.cierre{background:#f3e5f5;border-left:6px solid var(--c1);border-radius:12px;padding:12px 14px;font-weight:700;margin-top:6px;font-size:1.25rem;line-height:2;word-spacing:.2em}
.consejo{text-align:center;color:var(--muted);font-size:.92rem;margin:6px 0 0}
.resultado{display:none;background:#fff;border:3px solid var(--verde);border-radius:18px;padding:16px;text-align:center;margin:14px 0}
.resultado .estrellas{font-size:2.6rem;letter-spacing:6px}
.resultado b{font:800 1.4rem "Baloo 2",system-ui}
.resultado .dato{display:inline-block;margin:6px 10px;font-size:1.05rem}
.resultado button{margin-top:10px;border:0;border-radius:999px;padding:10px 18px;background:var(--c2);color:#fff;font:800 1rem "Baloo 2",system-ui;cursor:pointer}
.pregunta{display:none;background:#fff;border:3px solid var(--c1);border-radius:18px;padding:14px;margin-top:10px;box-shadow:0 8px 22px rgba(0,0,0,.15)}
.pregunta .num{font:800 .95rem "Baloo 2",system-ui;color:var(--c2)}
.pregunta .preg{font:800 1.35rem/1.3 "Baloo 2",system-ui;margin:4px 0 10px}
.pregunta .ops{display:grid;gap:8px}
.pregunta .ops button{text-align:left;border:2px solid var(--line);background:#fffaf3;border-radius:14px;padding:12px 14px;font:700 1.1rem Nunito,system-ui;color:var(--ink);cursor:pointer}
.pregunta .ops button.ok{background:#e8f5e9;border-color:var(--verde);color:var(--verde)}
.pregunta .ops button.mal{background:#fff3e0;border-color:#ef6c00;color:#b45309;animation:mueve .35s}
.pregunta .msg{min-height:1.4em;margin-top:8px;font-weight:800;text-align:center}
.pregunta .acc{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.pregunta .acc button{border:0;border-radius:999px;padding:8px 14px;font:800 .95rem "Baloo 2",system-ui;cursor:pointer;background:#eee;color:var(--ink)}
@keyframes mueve{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.idioma{display:flex;justify-content:center;gap:8px;margin:10px 0 0}
.idioma a{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font:800 .95rem "Baloo 2",system-ui;color:var(--ink);text-decoration:none}
.idioma a.on{border-color:var(--c1);background:var(--c1);color:#fff}
.w.magica{border-bottom:3px dotted #7c4dff;color:#5e35b1}
.w.magica.leida,.w.magica.bien{color:inherit}
.w.oculta{color:transparent!important;background:#eee6f5!important;border-bottom:3px solid var(--c1);min-width:3em;box-shadow:none!important;transform:none!important}
.w.revelada{color:var(--verde)!important;font-weight:800}
.popup{position:fixed;left:12px;right:12px;bottom:14px;max-width:520px;margin:auto;z-index:20;background:#fff;border:3px solid #7c4dff;border-radius:18px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:none}
.popup b{font:800 1.4rem "Baloo 2",system-ui;color:#5e35b1}
.popup p{margin:4px 0 10px;font-size:1.15rem}
.popup button{border:0;border-radius:999px;padding:8px 14px;font:800 .95rem "Baloo 2",system-ui;cursor:pointer;margin-right:6px;background:#ede7f6;color:#4527a0}
.grabar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.grabar button,.grabar a{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:800 .95rem "Baloo 2",system-ui;color:var(--ink);cursor:pointer;text-decoration:none}
.grabar button.rec{background:var(--rojo);color:#fff;border-color:var(--rojo);animation:latido 1.2s infinite}
.grabar small{width:100%;text-align:center;color:var(--muted)}
.album{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px;margin-top:24px}
.album h2{margin:0 0 4px}
.album .sub{color:var(--muted);margin:0 0 10px;font-size:.95rem}
.estampas{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.estampa{aspect-ratio:1;border-radius:50%;overflow:hidden;border:3px solid var(--c2);background:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none}
.estampa img{width:100%;height:100%;object-fit:cover}
.estampa.no{border:3px dashed #d7ccc8;background:#faf6f2;color:#bcaaa4;font:800 1.4rem "Baloo 2",system-ui}
.album .acc{text-align:center;margin-top:12px}
.album .acc button{border:0;border-radius:999px;padding:11px 18px;background:var(--c1);color:#fff;font:800 1.05rem "Baloo 2",system-ui;cursor:pointer}
.album input{width:100%;max-width:320px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;font:700 1.05rem Nunito,system-ui;margin:6px 0}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:30;background:var(--verde);color:#fff;font:800 1.05rem "Baloo 2",system-ui;padding:10px 18px;border-radius:999px;box-shadow:0 8px 20px rgba(0,0,0,.25);display:none;max-width:92vw;text-align:center}
h2{font:800 1.3rem "Baloo 2",system-ui;color:var(--c1);margin:28px 0 8px}
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.lista a{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-decoration:none;color:var(--ink);font-weight:700;font-size:.92rem}
.lista a.actual{border-color:var(--c2);background:#fff3e0}
.lista a small{display:block;color:var(--verde);font-weight:800}
.aviso{text-align:center;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:0 16px 28px}
footer a{color:var(--c1);font-weight:700}
@media (prefers-reduced-motion: reduce){.w{transition:none}.w.ahora{transform:none}}
</style>
</head>
<body>
<header><a id="volver" href="#">📖</a></header>
<main>
  <div id="vista"><p class="aviso">Cargando…</p></div>
  <div class="album" id="album"></div>
  <h2>Todos los cuentos</h2>
  <div class="lista" id="lista"></div>
</main>
<div class="popup" id="popup"></div><div class="toast" id="toast"></div>
<footer>© 2026 Ediciones Guizar · <a id="conoce" href="#">Conoce el libro</a></footer>
<script>
const LIBROS = {"f": {"nombre": "Fábulas para leer y escuchar", "carpeta": "fabulas", "venta": "../libro-fabulas/", "cierre": "Moraleja:", "cierreEn": "Moral:", "img": "https://res.cloudinary.com/dgdw8fbku/image/upload/c_limit,w_900/f_auto,q_auto/ediciones-guizar/fabulas/{id}.png", "c1": "#6a1b9a", "c2": "#ef6c00", "items": [{"id": "liebre-tortuga", "t": "La liebre y la tortuga", "p": ["En el bosque vivía una liebre muy veloz que siempre presumía: «¡Nadie corre como yo!». Un día, una tortuga le dijo con calma: «Te reto a una carrera».", "Todos los animales se rieron, pero la carrera empezó. La liebre salió como un rayo y pronto dejó muy atrás a la tortuga. «Tengo tiempo de sobra», pensó, y se acostó a dormir bajo un árbol.", "Mientras tanto, la tortuga caminaba paso a paso, sin detenerse nunca. Pasó junto a la liebre dormida y siguió adelante.", "Cuando la liebre despertó, corrió con todas sus fuerzas, pero ya era tarde: la tortuga estaba cruzando la meta. Todos aplaudieron a la tortuga, que sonreía feliz."], "m": "Poco a poco y sin rendirse, se llega más lejos que corriendo y presumiendo.", "q": [["¿Qué decía siempre la liebre?", "Que nadie corría como ella", "Que estaba muy cansada", "Que quería ser amiga de todos"], ["¿Qué hizo la liebre cuando dejó atrás a la tortuga?", "Se acostó a dormir bajo un árbol", "Se puso a comer zanahorias", "Regresó por la tortuga"], ["¿Cómo caminaba la tortuga?", "Paso a paso, sin detenerse", "Muy rápido, saltando", "Se detenía a descansar"], ["¿Quién ganó la carrera?", "La tortuga", "La liebre", "Nadie, empataron"]], "mg": [["presumía", "presumir", "hablar de lo bueno que eres para que los demás te admiren"], ["veloz", "veloz", "que es muy rápido"], ["reto", "retar", "invitar a alguien a competir contigo"], ["meta", "meta", "el lugar donde termina una carrera"]], "fr": [[32, "carrera", ["pelea", "fiesta"]], [68, "árbol", ["puente", "carro"]], [107, "meta", ["casa", "cama"]]], "en": {"t": "The Hare and the Tortoise", "p": ["In the forest lived a very fast hare who was always bragging: “Nobody runs like me!” One day, a tortoise calmly said to her: “I challenge you to a race.”", "All the animals laughed, but the race began. The hare shot off like lightning and soon left the tortoise far behind. “I have plenty of time,” she thought, and lay down to sleep under a tree.", "Meanwhile, the tortoise walked step by step, never stopping. She passed the sleeping hare and kept going.", "When the hare woke up, she ran with all her strength, but it was too late: the tortoise was crossing the finish line. Everyone cheered for the tortoise, who smiled happily."], "m": "Little by little, without giving up, you get further than by running and bragging."}}, {"id": "leon-raton", "t": "El león y el ratón", "p": ["Un león dormía bajo el sol cuando un ratoncito, jugando, le pasó por encima de la nariz. El león despertó enojado y lo atrapó con su enorme pata.", "«¡Por favor, déjame ir!», le pidió el ratón. «Algún día yo te ayudaré». El león soltó una carcajada: «¿Tú, tan pequeño, ayudarme a mí?». Pero lo dejó ir.", "Días después, unos cazadores atraparon al león con una red. El león rugía y rugía, pero no podía salir.", "El ratoncito escuchó los rugidos y llegó corriendo. Con sus dientes pequeños y filosos mordió la cuerda, una y otra vez, hasta que la red se rompió. El león quedó libre y le dijo: «Gracias, amigo. Ahora sé que los pequeños también pueden ayudar mucho»."], "m": "Nadie es tan pequeño que no pueda ayudar. Haz el bien, y el bien regresa.", "q": [["¿Por qué despertó enojado el león?", "Un ratoncito le pasó por la nariz", "Empezó a llover", "Tenía mucha hambre"], ["¿Qué le prometió el ratón al león?", "Que algún día lo ayudaría", "Que le traería comida", "Que nunca volvería"], ["¿Qué le pasó al león días después?", "Unos cazadores lo atraparon con una red", "Se cayó a un río", "Se perdió en el bosque"], ["¿Cómo liberó el ratón al león?", "Mordió la cuerda hasta romper la red", "Llamó a otros leones", "Asustó a los cazadores"]], "mg": [["carcajada", "carcajada", "una risa fuerte y ruidosa"], ["filosos", "filoso", "que corta muy bien"], ["cazadores", "cazador", "persona que atrapa animales"], ["red", "red", "tejido de cuerdas con agujeros para atrapar animales"]], "fr": [[32, "pata", ["cola", "boca"]], [70, "red", ["caja", "jaula"]], [110, "libre", ["triste", "dormido"]]], "en": {"t": "The Lion and the Mouse", "p": ["A lion was sleeping in the sun when a little mouse, playing, ran right over his nose. The lion woke up angry and caught him with his enormous paw.", "“Please, let me go!” begged the mouse. “Someday I will help you.” The lion roared with laughter: “You, so small, help me?” But he let him go.", "Days later, some hunters caught the lion in a net. The lion roared and roared, but he could not get out.", "The little mouse heard the roars and came running. With his small, sharp teeth he chewed the rope, again and again, until the net broke. The lion was free and said: “Thank you, friend. Now I know that little ones can help a lot too.”"], "m": "Nobody is too small to help. Do good, and good comes back to you."}}, {"id": "cigarra-hormiga", "t": "La cigarra y la hormiga", "p": ["Todo el verano, la cigarra cantaba y tocaba su guitarra bajo los árboles. La hormiga, en cambio, pasaba los días cargando granos de trigo a su casa.", "«¿Por qué trabajas tanto?», se burlaba la cigarra. «Ven a cantar conmigo». «Estoy guardando comida para el invierno», respondía la hormiga.", "Llegó el invierno con su frío y su nieve. La cigarra no tenía nada que comer y tocó temblando a la puerta de la hormiga.", "La hormiga la dejó pasar y compartió su comida con ella. «Gracias», dijo la cigarra, avergonzada. «El próximo verano voy a cantar, pero también voy a guardar para cuando haga falta»."], "m": "Hay tiempo para jugar y tiempo para trabajar: el que guarda hoy, mañana tiene.", "q": [["¿Qué hacía la hormiga todo el verano?", "Cargaba granos de trigo a su casa", "Cantaba bajo los árboles", "Dormía todo el día"], ["¿Para qué guardaba comida la hormiga?", "Para el invierno", "Para venderla", "Para una fiesta"], ["¿Qué le pasó a la cigarra en el invierno?", "No tenía nada que comer", "Se fue de vacaciones", "Encontró mucha comida"], ["¿Qué hizo la hormiga cuando llegó la cigarra?", "Compartió su comida con ella", "No le abrió la puerta", "Se burló de ella"]], "mg": [["cigarra", "cigarra", "insecto que canta mucho en verano"], ["burlaba", "burlarse", "reírse de alguien para hacerlo sentir mal"], ["temblando", "temblar", "moverse solo por tener frío o miedo"], ["avergonzada", "avergonzada", "que siente pena por algo que hizo"]], "fr": [[49, "invierno", ["verano", "domingo"]], [52, "hormiga", ["cigarra", "abuela"]], [86, "comida", ["guitarra", "casa"]]], "en": {"t": "The Grasshopper and the Ant", "p": ["All summer long, the grasshopper sang and played her guitar under the trees. The ant, instead, spent her days carrying grains of wheat to her home.", "“Why do you work so hard?” teased the grasshopper. “Come and sing with me.” “I am saving food for the winter,” answered the ant.", "Winter came with its cold and its snow. The grasshopper had nothing to eat, and shivering, she knocked on the ant’s door.", "The ant let her in and shared her food with her. “Thank you,” said the grasshopper, embarrassed. “Next summer I will sing, but I will also save for when I need it.”"], "m": "There is time to play and time to work: whoever saves today will have tomorrow."}}, {"id": "pastorcito", "t": "El pastorcito mentiroso", "p": ["Un pastorcito cuidaba sus ovejas en el cerro. Un día, aburrido, gritó: «¡Auxilio, viene el lobo!». La gente del pueblo subió corriendo a ayudarlo, pero no había ningún lobo. El pastorcito se rio mucho.", "Días después volvió a gritar: «¡El lobo, el lobo!». Otra vez la gente subió corriendo, y otra vez era mentira.", "Una tarde, el lobo apareció de verdad. «¡Auxilio, el lobo está aquí!», gritó el pastorcito con todas sus fuerzas. Pero esta vez nadie subió, porque nadie le creyó.", "El lobo asustó a las ovejas y se las llevó. El pastorcito, muy triste, aprendió que cuando uno miente, después nadie le cree aunque diga la verdad."], "m": "Di siempre la verdad: la confianza cuesta mucho ganarla y muy poco perderla.", "q": [["¿Qué gritó el pastorcito cuando estaba aburrido?", "¡Auxilio, viene el lobo!", "¡Se perdió una oveja!", "¡Está lloviendo!"], ["¿Había lobo la segunda vez que gritó?", "No, otra vez era mentira", "Sí, había dos lobos", "Sí, pero se fue"], ["¿Por qué nadie subió cuando llegó el lobo de verdad?", "Porque nadie le creyó", "Porque estaban dormidos", "Porque no lo escucharon"], ["¿Qué aprendió el pastorcito?", "Que al mentir después nadie te cree", "Que los lobos son buenos", "Que es mejor cuidar vacas"]], "mg": [["pastorcito", "pastor", "persona que cuida ovejas"], ["auxilio", "auxilio", "palabra que se grita para pedir ayuda"], ["cerro", "cerro", "monte pequeño"], ["mentira", "mentira", "algo que se dice y no es verdad"]], "fr": [[18, "lobo", ["gato", "perro"]], [56, "mentira", ["fiesta", "verdad"]], [84, "creyó", ["vio", "llamó"]]], "en": {"t": "The Boy Who Cried Wolf", "p": ["A shepherd boy looked after his sheep on the hill. One day, bored, he shouted: “Help, the wolf is coming!” The people of the village ran up to help him, but there was no wolf. The boy laughed and laughed.", "Days later he shouted again: “The wolf, the wolf!” Once again the people ran up the hill, and once again it was a lie.", "One afternoon, the wolf really came. “Help, the wolf is here!” shouted the boy with all his might. But this time nobody came, because nobody believed him.", "The wolf scared the sheep and took them away. The boy, very sad, learned that when you lie, later nobody believes you even when you tell the truth."], "m": "Always tell the truth: trust is hard to earn and easy to lose."}}, {"id": "zorra-uvas", "t": "La zorra y las uvas", "p": ["Una zorra con mucha hambre caminaba por el campo cuando vio unas uvas moradas que colgaban de una parra muy alta. «¡Qué ricas se ven!», pensó.", "Saltó para alcanzarlas, pero no llegó. Saltó otra vez, más alto, y tampoco. Lo intentó muchas veces hasta que quedó cansada y sin aire.", "Entonces levantó la nariz, dio media vuelta y dijo: «Bah, ni las quiero. Seguro están verdes y agrias».", "Un pajarito que la vio desde una rama le dijo: «No están verdes, amiga zorra. Lo que pasa es que no pudiste alcanzarlas». La zorra se fue, un poco apenada."], "m": "Cuando no logramos algo, es mejor aceptarlo o intentarlo de otra forma, que decir que no lo queríamos.", "q": [["¿Qué vio la zorra que se veía muy rico?", "Unas uvas moradas en una parra alta", "Un pastel en una mesa", "Unas manzanas en el suelo"], ["¿Pudo alcanzar las uvas la zorra?", "No, aunque lo intentó muchas veces", "Sí, al primer salto", "Sí, con una escalera"], ["¿Qué dijo la zorra de las uvas?", "Que estaban verdes y agrias", "Que eran las más ricas", "Que se las daría a sus amigos"], ["¿Quién le dijo a la zorra la verdad?", "Un pajarito", "Una tortuga", "Un granjero"]], "mg": [["parra", "parra", "planta que trepa y de la que crecen las uvas"], ["agrias", "agrio", "de sabor ácido, como el limón"], ["apenada", "apenada", "que siente un poco de vergüenza"], ["moradas", "morado", "color como el de las uvas o la berenjena"]], "fr": [[25, "alta", ["chica", "verde"]], [72, "agrias", ["dulces", "grandes"]], [95, "alcanzarlas", ["comerlas", "verlas"]]], "en": {"t": "The Fox and the Grapes", "p": ["A very hungry fox was walking through the field when she saw some purple grapes hanging from a very tall vine. “They look so tasty!” she thought.", "She jumped to reach them, but she couldn’t. She jumped again, higher, and still couldn’t. She tried many times until she was tired and out of breath.", "Then she lifted her nose, turned around and said: “Bah, I don’t even want them. I’m sure they are green and sour.”", "A little bird who saw her from a branch said: “They are not green, friend fox. You just couldn’t reach them.” The fox walked away, a little ashamed."], "m": "When we can’t do something, it is better to accept it or try another way than to say we didn’t want it."}}, {"id": "cuervo-jarra", "t": "El cuervo y la jarra", "p": ["Era un día muy caluroso y un cuervo tenía mucha sed. Voló y voló hasta que encontró una jarra con un poquito de agua en el fondo.", "Metió el pico, pero no alcanzaba el agua. Intentó tirar la jarra, pero pesaba demasiado. El cuervo se quedó pensando.", "Entonces tuvo una idea: tomó una piedrita con el pico y la dejó caer dentro de la jarra. Luego otra, y otra más. Con cada piedrita, el agua subía un poquito.", "Después de muchas piedritas, el agua llegó hasta arriba. El cuervo bebió feliz hasta que se le quitó la sed. Pensando con calma, había encontrado la solución."], "m": "Cuando algo parece imposible, piensa con calma: muchas veces la inteligencia y la paciencia encuentran el camino.", "q": [["¿Qué encontró el cuervo cuando tenía sed?", "Una jarra con poquita agua", "Un río muy grande", "Un vaso de leche"], ["¿Por qué no podía beber el cuervo?", "Su pico no alcanzaba el agua", "El agua estaba muy fría", "La jarra estaba cerrada"], ["¿Qué echó el cuervo dentro de la jarra?", "Piedritas", "Hojas", "Semillas"], ["¿Cómo encontró la solución el cuervo?", "Pensando con calma", "Pidiendo ayuda", "Rompiendo la jarra"]], "mg": [["caluroso", "caluroso", "que hace mucho calor"], ["jarra", "jarra", "recipiente con asa para servir agua"], ["piedrita", "piedrita", "piedra muy pequeña"], ["solución", "solución", "la respuesta a un problema"]], "fr": [[15, "sed", ["hambre", "sueño"]], [51, "pensando", ["durmiendo", "llorando"]], [109, "solución", ["comida", "casa"]]], "en": {"t": "The Crow and the Pitcher", "p": ["It was a very hot day and a crow was very thirsty. He flew and flew until he found a pitcher with a little bit of water at the bottom.", "He put his beak in, but he couldn’t reach the water. He tried to knock the pitcher over, but it was too heavy. The crow stopped to think.", "Then he had an idea: he picked up a pebble with his beak and dropped it into the pitcher. Then another, and another one. With each pebble, the water rose a little bit.", "After many pebbles, the water reached the top. The crow drank happily until he was no longer thirsty. By thinking calmly, he had found the solution."], "m": "When something seems impossible, think calmly: intelligence and patience often find the way."}}, {"id": "gallina-oro", "t": "La gallina de los huevos de oro", "p": ["Un granjero y su esposa tenían una gallina muy especial: cada mañana ponía un huevo de oro. Con cada huevo compraban lo que necesitaban y vivían tranquilos.", "Pero un día el granjero pensó: «Si la gallina pone huevos de oro, por dentro debe estar llena de oro. ¡Así seremos ricos de una vez!».", "Su esposa le dijo: «Espera, mejor sigamos así», pero él no la escuchó. Sin pensarlo más, abrió a la gallina para buscar el tesoro.", "Por dentro no había nada de oro: era una gallina como cualquier otra. Y desde ese día ya no hubo más huevos de oro. El granjero entendió, muy tarde, que por querer todo de golpe lo perdió todo."], "m": "Quien todo lo quiere, todo lo pierde. Cuida y agradece lo que tienes.", "q": [["¿Qué tenía de especial la gallina?", "Ponía un huevo de oro cada mañana", "Sabía cantar", "Era de color dorado"], ["¿Qué pensó el granjero de la gallina?", "Que por dentro estaba llena de oro", "Que estaba enferma", "Que era muy pequeña"], ["¿Escuchó el granjero a su esposa?", "No, no la escuchó", "Sí, le hizo caso", "Ella no dijo nada"], ["¿Qué encontró el granjero dentro de la gallina?", "Nada de oro", "Muchas monedas", "Un huevo gigante"]], "mg": [["granjero", "granjero", "persona que trabaja en una granja con animales y plantas"], ["tesoro", "tesoro", "cosas de mucho valor, como oro o joyas"], ["ricos", "rico", "que tiene mucho dinero"], ["golpe", "de golpe", "todo de una vez, de repente"]], "fr": [[23, "oro", ["plata", "chocolate"]], [83, "tesoro", ["huevo", "camino"]], [90, "oro", ["agua", "pan"]]], "en": {"t": "The Hen That Laid the Golden Eggs", "p": ["A farmer and his wife had a very special hen: every morning she laid a golden egg. With each egg they bought what they needed and lived peacefully.", "But one day the farmer thought: “If the hen lays golden eggs, inside she must be full of gold. That way we’ll be rich all at once!”", "His wife said: “Wait, let’s keep things as they are,” but he did not listen. Without thinking any more, he opened the hen to look for the treasure.", "Inside there was no gold at all: she was a hen like any other. And from that day on, there were no more golden eggs. The farmer understood, too late, that by wanting everything at once he lost everything."], "m": "Whoever wants it all loses it all. Take care of what you have and be thankful."}}, {"id": "zorra-ciguena", "t": "La zorra y la cigüeña", "p": ["Una zorra bromista invitó a comer a la cigüeña. Le sirvió una sopa muy rica, pero en un plato plano. La zorra se la tomó a lengüetazos, mientras la cigüeña, con su pico largo, no pudo probar ni una gota.", "«¿No te gustó?», preguntó la zorra, riéndose. La cigüeña no dijo nada y, al despedirse, la invitó a comer al día siguiente.", "Cuando llegó la zorra, la cigüeña sirvió la comida en jarras altas y delgadas. La cigüeña comía feliz metiendo su pico largo, pero la zorra no podía meter el hocico.", "La zorra se fue con hambre, pensando: «Ahora sé cómo se sintió ella». Desde entonces, cuando invita a alguien, piensa primero en lo que necesita su invitado."], "m": "Trata a los demás como te gustaría que te trataran a ti.", "q": [["¿En qué le sirvió la zorra la sopa a la cigüeña?", "En un plato plano", "En una jarra alta", "En un vaso"], ["¿Qué hizo la cigüeña al despedirse?", "Invitó a la zorra a comer", "Se enojó y gritó", "Se llevó la sopa"], ["¿En qué sirvió la cigüeña la comida?", "En jarras altas y delgadas", "En platos planos", "En el suelo"], ["¿Qué aprendió la zorra?", "A pensar en lo que necesita su invitado", "A cocinar sopa", "A volar como la cigüeña"]], "mg": [["bromista", "bromista", "a quien le gusta hacer bromas"], ["cigüeña", "cigüeña", "ave de patas y pico muy largos"], ["lengüetazos", "lengüetazo", "lamer con la lengua, como los perros"], ["invitado", "invitado", "persona a la que invitas a tu casa o a una fiesta"]], "fr": [[44, "gota", ["cuchara", "pluma"]], [80, "delgadas", ["planas", "rotas"]], [123, "invitado", ["plato", "amigo"]]], "en": {"t": "The Fox and the Stork", "p": ["A playful fox invited the stork to eat. She served her a very tasty soup, but on a flat plate. The fox lapped it up, while the stork, with her long beak, couldn’t taste a single drop.", "“Didn’t you like it?” asked the fox, laughing. The stork said nothing and, when saying goodbye, invited the fox to eat the next day.", "When the fox arrived, the stork served the food in tall, thin jars. The stork ate happily, putting in her long beak, but the fox couldn’t fit her snout inside.", "The fox went home hungry, thinking: “Now I know how she felt.” Since then, when she invites someone, she first thinks about what her guest needs."], "m": "Treat others the way you would like to be treated."}}, {"id": "amigos-oso", "t": "Los dos amigos y el oso", "p": ["Dos amigos caminaban juntos por el bosque. «Pase lo que pase, nos cuidamos el uno al otro», se prometieron.", "De pronto, apareció un oso enorme. Uno de los amigos, sin pensar en el otro, subió rápido a un árbol y se escondió entre las ramas.", "El otro amigo no alcanzó a subir. Se acostó en el suelo y se quedó muy quieto, sin respirar. El oso se acercó, lo olfateó... y, como no se movía, se fue por donde vino.", "El amigo del árbol bajó y le preguntó, nervioso: «¿Qué te dijo el oso al oído?». El otro respondió: «Me dijo que no camine con amigos que me dejan solo cuando hay peligro»."], "m": "Los amigos de verdad se conocen en los momentos difíciles.", "q": [["¿Qué se prometieron los dos amigos?", "Cuidarse el uno al otro", "Correr una carrera", "Buscar un tesoro"], ["¿Qué hizo uno de los amigos al ver al oso?", "Subió a un árbol sin pensar en el otro", "Se enfrentó al oso", "Ayudó a su amigo"], ["¿Qué hizo el amigo que no alcanzó a subir?", "Se quedó muy quieto en el suelo", "Gritó muy fuerte", "Se fue corriendo"], ["¿Qué dijo que le había dicho el oso?", "Que no camine con amigos que lo dejan solo", "Que tenía mucha hambre", "Que volvería mañana"]], "mg": [["prometieron", "prometer", "decir que vas a hacer algo con seguridad"], ["olfateó", "olfatear", "oler algo con atención, como hacen los animales"], ["ramas", "rama", "parte del árbol que sale del tronco y tiene hojas"], ["peligro", "peligro", "algo que puede hacerte daño"]], "fr": [[29, "oso", ["lobo", "león"]], [50, "ramas", ["nubes", "piedras"]], [118, "peligro", ["comida", "fiesta"]]], "en": {"t": "The Two Friends and the Bear", "p": ["Two friends were walking together through the forest. “No matter what happens, we will take care of each other,” they promised.", "Suddenly, an enormous bear appeared. One of the friends, without thinking of the other, quickly climbed a tree and hid among the branches.", "The other friend couldn’t climb in time. He lay down on the ground and stayed very still, without breathing. The bear came close, sniffed him... and, since he didn’t move, went back the way he came.", "The friend in the tree came down and asked, nervously: “What did the bear whisper in your ear?” The other answered: “He told me not to walk with friends who leave me alone when there is danger.”"], "m": "You find out who your true friends are in difficult times."}}, {"id": "viento-sol", "t": "El viento y el sol", "p": ["Un día, el viento y el sol discutían quién era el más fuerte. «Veamos quién logra que ese señor se quite el abrigo», dijo el sol.", "El viento empezó primero. Sopló y sopló con muchísima fuerza. Pero entre más soplaba, más se agarraba el señor su abrigo para no tener frío.", "Cansado, el viento se rindió. Entonces el sol salió de entre las nubes y brilló suave y calientito.", "El señor sintió el calor, se secó la frente y, muy a gusto, se quitó el abrigo solito. El viento entendió que el sol había ganado sin gritar y sin empujar, solo con su calor."], "m": "Con amabilidad se logra más que con fuerza.", "q": [["¿Qué discutían el viento y el sol?", "Quién era el más fuerte", "Quién era el más bonito", "Quién llegaba primero"], ["¿Qué hacía el señor cuando el viento soplaba?", "Se agarraba más su abrigo", "Se quitaba el abrigo", "Se iba corriendo"], ["¿Cómo brilló el sol?", "Suave y calientito", "Muy fuerte y enojado", "No brilló"], ["¿Por qué se quitó el abrigo el señor?", "Porque sintió el calor del sol", "Porque el viento se lo quitó", "Porque se iba a bañar"]], "mg": [["discutían", "discutir", "hablar con otro cuando no piensan igual"], ["abrigo", "abrigo", "ropa gruesa para no tener frío"], ["rindió", "rendirse", "dejar de intentar algo"], ["frente", "frente", "parte de la cara arriba de los ojos"]], "fr": [[17, "fuerte", ["bonito", "rápido"]], [27, "abrigo", ["sombrero", "zapato"]], [78, "calor", ["fuerza", "viento"]]], "en": {"t": "The Wind and the Sun", "p": ["One day, the wind and the sun were arguing about who was the strongest. “Let’s see who can make that man take off his coat,” said the sun.", "The wind went first. It blew and blew with tremendous strength. But the harder it blew, the tighter the man held on to his coat so he wouldn’t be cold.", "Tired, the wind gave up. Then the sun came out from behind the clouds and shone soft and warm.", "The man felt the warmth, wiped his forehead and, very comfortable, took off his coat all by himself. The wind understood that the sun had won without shouting and without pushing, just with its warmth."], "m": "Kindness achieves more than force."}}]}, "c": {"nombre": "Cuentos de Navidad para leer y escuchar", "carpeta": "navidad", "venta": "../libro-cuentos-navidad/", "cierre": "Para pensar:", "cierreEn": "Something to think about:", "img": "https://pnjglzuxsyahxcbgjwvq.supabase.co/storage/v1/object/public/archivos/libros/navidad/{id}.jpg", "c1": "#b71c1c", "c2": "#2e7d32", "items": [{"id": "posada", "t": "La posada de la calle Luna", "p": ["En la calle Luna, todos los vecinos se juntaban cada diciembre para hacer la posada. Ese año le tocaba a la familia de Lupita.", "Por la tarde, los niños recibieron velitas y faroles de papel. Caminaron despacio, cantando, de casa en casa, pidiendo posada como hicieron José y María hace mucho tiempo.", "En la última casa, la puerta se abrió y todos gritaron de gusto: «¡Entren, peregrinos!». Adentro había ponche calientito, tamales y una piñata enorme.", "Lupita vio que Don Ramón, el vecino de la esquina, miraba desde su ventana. «Mamá, ¿lo invitamos?», preguntó. Don Ramón llegó sonriendo. «Hace años que nadie me invitaba», dijo. Esa noche, la posada fue más alegre que nunca."], "m": "La Navidad se disfruta más cuando nadie se queda afuera.", "q": [["¿A quién le tocaba hacer la posada ese año?", "A la familia de Lupita", "A Don Ramón", "A la escuela"], ["¿Qué recibieron los niños por la tarde?", "Velitas y faroles de papel", "Juguetes nuevos", "Globos de colores"], ["¿Qué había adentro de la última casa?", "Ponche, tamales y una piñata", "Un árbol de Navidad gigante", "Un pastel de chocolate"], ["¿A quién invitaron Lupita y su mamá?", "A Don Ramón, el vecino de la esquina", "A su maestra", "A los Reyes Magos"]], "mg": [["posada", "posada", "fiesta de diciembre donde se pide hospedaje cantando, como José y María"], ["peregrinos", "peregrino", "persona que camina de un lugar a otro para llegar a un sitio especial"], ["faroles", "farol", "lámpara con una luz adentro que se lleva en la mano"], ["vecinos", "vecino", "persona que vive cerca de tu casa"]], "fr": [[20, "posada", ["piñata", "comida"]], [80, "piñata", ["pelota", "bicicleta"]], [119, "nunca", ["siempre", "ayer"]]], "en": {"t": "The Posada on Luna Street", "p": ["On Luna Street, all the neighbors got together every December to hold the posada. That year it was Lupita’s family’s turn.", "In the afternoon, the children were given little candles and paper lanterns. They walked slowly, singing, from house to house, asking for shelter, as Joseph and Mary did long ago.", "At the last house, the door opened and everyone shouted with joy: “Come in, pilgrims!” Inside there was warm ponche, tamales and an enormous piñata.", "Lupita saw that Don Ramón, the neighbor on the corner, was watching from his window. “Mom, can we invite him?” she asked. Don Ramón came over smiling. “It has been years since anyone invited me,” he said. That night, the posada was happier than ever."], "m": "Christmas is more fun when nobody is left out."}}, {"id": "pinata", "t": "La piñata de siete picos", "p": ["Mateo y su abuelo hicieron una piñata de estrella con siete picos. Usaron una olla de barro, papel periódico, engrudo y mucho papel de colores.", "«¿Por qué tiene siete picos, abuelo?», preguntó Mateo. El abuelo le explicó: «Dicen que cada pico es algo que queremos sacar de nuestra vida, como el enojo, la flojera o el egoísmo. Al romper la piñata, salen cosas buenas».", "En la posada, Mateo se puso la venda en los ojos. Todos cantaban: «¡Dale, dale, dale!». Pegó una vez, dos veces... ¡y la piñata se rompió! Cayeron cacahuates, mandarinas, cañas y dulces.", "Mateo llenó sus manos, pero vio a su prima pequeña sin nada. Sin pensarlo, le dio la mitad. El abuelo le guiñó un ojo: el egoísmo ya se había ido."], "m": "Lo que compartes vale más que lo que guardas para ti solo.", "q": [["¿Con qué hicieron la piñata Mateo y su abuelo?", "Olla de barro, periódico, engrudo y papel", "Plástico y cartón", "Madera y clavos"], ["Según el abuelo, ¿qué es cada pico de la piñata?", "Algo malo que queremos sacar", "Un dulce escondido", "Un día de diciembre"], ["¿Qué cayó de la piñata?", "Cacahuates, mandarinas, cañas y dulces", "Juguetes y pelotas", "Monedas de oro"], ["¿Qué hizo Mateo con sus dulces?", "Le dio la mitad a su prima", "Se los comió todos", "Los guardó para después"]], "mg": [["engrudo", "engrudo", "pegamento casero hecho con harina y agua"], ["egoísmo", "egoísmo", "pensar solo en uno mismo y no en los demás"], ["barro", "barro", "tierra mojada que se puede moldear y luego se seca"], ["venda", "venda", "tela para tapar los ojos"]], "fr": [[29, "colores", ["plástico", "madera"]], [100, "dulces", ["piedras", "zapatos"]], [118, "mitad", ["piñata", "dulce"]]], "en": {"t": "The Seven-Pointed Piñata", "p": ["Mateo and his grandpa made a star piñata with seven points. They used a clay pot, newspaper, homemade glue and lots of colored paper.", "“Why does it have seven points, Grandpa?” asked Mateo. His grandpa explained: “They say each point is something we want to take out of our lives, like anger, laziness or selfishness. When we break the piñata, good things come out.”", "At the posada, Mateo put on the blindfold. Everyone sang: “Hit it, hit it, hit it!” He swung once, twice... and the piñata broke! Out fell peanuts, tangerines, sugar cane and candy.", "Mateo filled his hands, but he saw his little cousin with nothing. Without thinking, he gave her half. His grandpa winked at him: the selfishness was already gone."], "m": "What you share is worth more than what you keep only for yourself."}}, {"id": "nacimiento", "t": "El borreguito del nacimiento", "p": ["Cada año, Sofía ayudaba a su abuela a poner el nacimiento. Sacaban de una caja a María, a José, al burrito, al buey, a los pastores y a los borreguitos.", "Pero esa vez faltaba un borreguito. Buscaron en toda la caja y no apareció. Sofía se puso triste: «El nacimiento no va a estar completo».", "La abuela sacó un poco de barro y le dijo: «Vamos a hacer uno nuevo». Con sus dedos, Sofía le dio forma: el cuerpo redondo, las orejitas y cuatro patitas. Lo dejó secar y lo pintó de blanco.", "No quedó perfecto: tenía una oreja más grande que la otra. Pero cuando lo puso junto a los pastores, la abuela dijo: «Es el borreguito más especial, porque lo hiciste tú». Y desde entonces, cada diciembre, Sofía lo busca primero."], "m": "Lo que hacemos con nuestras manos y con cariño tiene un valor especial.", "q": [["¿A quién ayudaba Sofía a poner el nacimiento?", "A su abuela", "A su maestra", "A su hermano"], ["¿Qué faltaba en el nacimiento ese año?", "Un borreguito", "El burrito", "La estrella"], ["¿Con qué hicieron el borreguito nuevo?", "Con barro", "Con papel", "Con plastilina"], ["¿Por qué era especial el borreguito?", "Porque lo hizo Sofía", "Porque era de oro", "Porque era el más grande"]], "mg": [["nacimiento", "nacimiento", "figuras que muestran cuando nació el niño Jesús, con María, José, pastores y animales"], ["barro", "barro", "tierra mojada que se puede moldear y luego se seca"], ["buey", "buey", "animal grande parecido a la vaca"], ["borreguitos", "borreguito", "oveja pequeña"]], "fr": [[33, "borreguitos", ["perritos", "gatitos"]], [58, "completo", ["bonito", "grande"]], [96, "blanco", ["verde", "rojo"]]], "en": {"t": "The Little Lamb of the Nativity", "p": ["Every year, Sofía helped her grandma set up the nativity scene. They took out of a box Mary, Joseph, the little donkey, the ox, the shepherds and the little lambs.", "But this time one little lamb was missing. They searched the whole box and it didn’t turn up. Sofía felt sad: “The nativity won’t be complete.”", "Grandma took out a bit of clay and said: “Let’s make a new one.” With her fingers, Sofía shaped it: a round body, little ears and four little legs. She let it dry and painted it white.", "It wasn’t perfect: one ear was bigger than the other. But when she placed it next to the shepherds, Grandma said: “It is the most special little lamb, because you made it.” And ever since, every December, Sofía looks for it first."], "m": "What we make with our hands and with love has a special value."}}, {"id": "nochebuena", "t": "La flor de Nochebuena", "p": ["Hace mucho tiempo, en un pueblo de México, vivía una niña llamada Pepita. En Nochebuena, todos llevaban un regalo al niño Dios en la iglesia del pueblo.", "Pepita era muy pobre y no tenía nada que llevar. Caminaba triste cuando vio unas ramitas verdes junto al camino. «Es poquito, pero lo doy con todo mi corazón», pensó, y las cortó.", "Algunos niños se rieron de ella: «¡Solo son hierbas!». Pepita no dijo nada. Entró a la iglesia y puso sus ramitas con mucho cariño.", "Entonces sucedió algo maravilloso: las hojas de arriba se pintaron de un rojo brillante, como estrellas. Desde ese día, a esa flor se le llama Nochebuena, y adorna las casas cada diciembre. Los antiguos mexicanos la conocían como cuetlaxóchitl."], "m": "Lo que importa de un regalo es el cariño con que se da, no su precio.", "q": [["¿Qué llevaba la gente a la iglesia en Nochebuena?", "Un regalo para el niño Dios", "Comida para la fiesta", "Velas de colores"], ["¿Qué llevó Pepita como regalo?", "Unas ramitas verdes", "Una muñeca", "Un pan dulce"], ["¿Qué dijeron algunos niños de sus ramitas?", "Que solo eran hierbas", "Que eran muy bonitas", "Que querían unas iguales"], ["¿De qué color se pintaron las hojas de arriba?", "Rojo brillante", "Amarillo", "Azul"]], "mg": [["nochebuena", "Nochebuena", "la noche del 24 de diciembre y también una flor roja de México"], ["cuetlaxóchitl", "cuetlaxóchitl", "nombre en náhuatl de la flor de Nochebuena"], ["ramitas", "ramita", "rama pequeña de una planta"], ["maravilloso", "maravilloso", "algo increíble que te sorprende"]], "fr": [[30, "pueblo", ["mar", "bosque"]], [59, "corazón", ["dinero", "mano"]], [113, "Nochebuena", ["Margarita", "Rosa"]]], "en": {"t": "The Poinsettia Flower", "p": ["A long time ago, in a town in Mexico, there lived a girl named Pepita. On Christmas Eve, everyone brought a gift to baby Jesus at the town church.", "Pepita was very poor and had nothing to bring. She was walking sadly when she saw some green branches beside the road. “It’s just a little, but I give it with all my heart,” she thought, and she picked them.", "Some children laughed at her: “Those are just weeds!” Pepita said nothing. She went into the church and lovingly placed her branches.", "Then something wonderful happened: the top leaves turned a bright red, like stars. Since that day, that flower is called Nochebuena, and it decorates homes every December. The ancient Mexicans knew it as cuetlaxóchitl."], "m": "What matters about a gift is the love it is given with, not its price."}}, {"id": "tamales", "t": "Los tamales de Nochebuena", "p": ["El 24 de diciembre, la cocina de la casa de Emiliano se llenó de gente. Toda la familia iba a hacer tamales para la cena de Nochebuena.", "La abuela preparaba la masa. Papá ponía a remojar las hojas de maíz. Mamá cocinaba el relleno de pollo con salsa verde, y la tía Rosa hacía los de dulce, color de rosa.", "«¿Y yo qué hago?», preguntó Emiliano. «Tú vas a untar la masa en las hojas», le dijo la abuela. Al principio le salían chuecos, pero poco a poco le quedaron cada vez mejor.", "En la noche, cuando la olla dejó salir su vapor delicioso, todos se sentaron a la mesa. «Estos tamales saben mejor porque los hicimos todos juntos», dijo la abuela. Y Emiliano sonrió, con la cara llena de masa."], "m": "Cuando todos ayudan, el trabajo se vuelve fiesta.", "q": [["¿Qué iba a hacer la familia de Emiliano?", "Tamales para Nochebuena", "Un pastel de cumpleaños", "Una piñata"], ["¿Qué preparaba la abuela?", "La masa", "El ponche", "Las hojas"], ["¿Qué trabajo le dieron a Emiliano?", "Untar la masa en las hojas", "Lavar los platos", "Poner la mesa"], ["¿Por qué sabían mejor los tamales, según la abuela?", "Porque los hicieron todos juntos", "Porque tenían mucho chile", "Porque eran comprados"]], "mg": [["remojar", "remojar", "dejar algo en agua para que se ablande"], ["vapor", "vapor", "humo blanco que sale del agua cuando hierve"], ["masa", "masa", "mezcla de maíz con la que se hacen los tamales"], ["relleno", "relleno", "lo que se pone adentro del tamal"]], "fr": [[30, "Nochebuena", ["cumpleaños", "Pascua"]], [35, "masa", ["sopa", "leche"]], [122, "juntos", ["rápido", "solos"]]], "en": {"t": "Christmas Eve Tamales", "p": ["On December 24th, the kitchen at Emiliano’s house filled with people. The whole family was going to make tamales for Christmas Eve dinner.", "Grandma prepared the dough. Dad soaked the corn husks. Mom cooked the chicken filling with green salsa, and Aunt Rosa made the sweet pink ones.", "“And what do I do?” asked Emiliano. “You are going to spread the dough on the husks,” said Grandma. At first they came out crooked, but little by little they turned out better and better.", "That night, when the pot let out its delicious steam, everyone sat down at the table. “These tamales taste better because we all made them together,” said Grandma. And Emiliano smiled, with his face covered in dough."], "m": "When everyone helps, work becomes a party."}}, {"id": "ponche", "t": "El ponche de Don Chuy", "p": ["Don Chuy vendía elotes en la esquina, pero cada diciembre cambiaba su carrito por una olla grande de ponche. Los niños de la colonia lo esperaban con ansias.", "«¿Qué le pone a su ponche, Don Chuy?», preguntó Camila. Él le enseñó: «Guayaba, tejocote, caña, manzana, ciruela pasa, canela y piloncillo. Y lo más importante: paciencia, para que hierva despacito».", "Un día de mucho frío, Camila vio que algunos señores que barrían la calle tenían las manos heladas. Le dijo a Don Chuy: «¿Y si les damos ponche?». Don Chuy sonrió y llenó varios vasos.", "Los señores se calentaron las manos con los vasos y dieron las gracias. Esa tarde, Camila aprendió que el ponche calienta la panza, pero compartirlo calienta el corazón."], "m": "Un pequeño gesto de bondad puede calentar el día de alguien.", "q": [["¿Qué vendía Don Chuy en diciembre?", "Ponche", "Elotes", "Tamales"], ["¿Qué era lo más importante del ponche según Don Chuy?", "La paciencia", "El azúcar", "La olla nueva"], ["¿A quién quiso darle ponche Camila?", "A los señores que barrían la calle", "A sus amigos de la escuela", "A su perro"], ["¿Qué aprendió Camila?", "Que compartir calienta el corazón", "Que el ponche es muy caro", "Que hace mucho frío"]], "mg": [["tejocote", "tejocote", "fruta pequeña y amarilla que se usa en el ponche"], ["piloncillo", "piloncillo", "dulce de caña de azúcar en forma de cono"], ["ansias", "ansias", "muchas ganas de que algo llegue"], ["paciencia", "paciencia", "saber esperar con calma"]], "fr": [[23, "ponche", ["elotes", "agua"]], [63, "despacito", ["rapidito", "frío"]], [126, "corazón", ["pie", "cabeza"]]], "en": {"t": "Don Chuy’s Ponche", "p": ["Don Chuy sold corn on the cob on the corner, but every December he swapped his cart for a big pot of ponche. The neighborhood children couldn’t wait for him.", "“What do you put in your ponche, Don Chuy?” asked Camila. He showed her: “Guava, tejocote, sugar cane, apple, prunes, cinnamon and piloncillo. And most important of all: patience, so it simmers slowly.”", "One very cold day, Camila saw that some men sweeping the street had frozen hands. She said to Don Chuy: “What if we give them some ponche?” Don Chuy smiled and filled several cups.", "The men warmed their hands with the cups and said thank you. That afternoon, Camila learned that ponche warms your tummy, but sharing it warms your heart."], "m": "A small act of kindness can warm someone’s day."}}, {"id": "estrella", "t": "La estrella que llegó tarde", "p": ["En el cielo vivía una estrellita muy pequeña que siempre llegaba tarde a todo. Las estrellas grandes se burlaban: «¡Eres tan chiquita que nadie te ve!».", "La noche de Navidad, todas las estrellas se pusieron en su lugar para brillar sobre el mundo. La estrellita, como siempre, se quedó dormida y llegó al final.", "Mientras buscaba su lugar, vio a un niño perdido en el campo, llorando, sin encontrar el camino a su casa. Nadie más lo había visto. La estrellita bajó un poco y brilló con todas sus fuerzas.", "El niño siguió su luz hasta llegar a su pueblo, donde su familia lo abrazó. Desde esa noche, las estrellas grandes ya no se burlaron. Aprendieron que no hay luz tan pequeña que no pueda guiar a alguien."], "m": "No importa qué tan pequeño seas: siempre puedes ayudar a alguien.", "q": [["¿Qué le decían las estrellas grandes a la estrellita?", "Que era tan chiquita que nadie la veía", "Que era la más bonita", "Que brillaba mucho"], ["¿Por qué llegó tarde la estrellita en Navidad?", "Se quedó dormida", "Se perdió en el cielo", "Estaba jugando"], ["¿A quién vio la estrellita?", "A un niño perdido en el campo", "A un perrito", "A los Reyes Magos"], ["¿Cómo llegó el niño a su pueblo?", "Siguiendo la luz de la estrellita", "En un caballo", "Su papá fue por él"]], "mg": [["burlaban", "burlarse", "reírse de alguien para hacerlo sentir mal"], ["perdido", "perdido", "que no sabe dónde está ni cómo regresar"], ["guiar", "guiar", "mostrar el camino a alguien"], ["fuerzas", "fuerza", "la energía que tienes para hacer algo"]], "fr": [[30, "ve", ["oye", "quiere"]], [58, "final", ["principio", "medio"]], [132, "alguien", ["nadie", "nada"]]], "en": {"t": "The Star That Came Late", "p": ["In the sky lived a very small little star who was always late for everything. The big stars made fun of her: “You are so tiny that nobody can see you!”", "On Christmas night, all the stars took their places to shine over the world. The little star, as always, fell asleep and arrived last.", "While she was looking for her place, she saw a boy lost in the countryside, crying, unable to find the way home. Nobody else had seen him. The little star came down a bit and shone with all her might.", "The boy followed her light until he reached his town, where his family hugged him. From that night on, the big stars stopped making fun of her. They learned that no light is so small that it can’t guide someone."], "m": "No matter how small you are: you can always help someone."}}, {"id": "carta-reyes", "t": "La carta de Valeria a los Reyes Magos", "p": ["El 5 de enero, Valeria se sentó a escribir su carta a los Reyes Magos: Melchor, Gaspar y Baltasar. Tenía muchas ganas de pedir una bicicleta.", "Pero se acordó de su hermanito Tomás, que siempre jugaba con una pelota rota. Y de su abuelita, que tenía frío en las mañanas. Valeria pensó un rato, borró la bicicleta y escribió otra cosa.", "«Queridos Reyes Magos: este año quiero pedirles una pelota nueva para Tomás y una cobija calientita para mi abuela. Si les sobra algo, una caja de colores para mí. Con cariño, Valeria».", "Dejó la carta en su zapato junto a la ventana. A la mañana siguiente, había una pelota, una cobija... y una caja de colores con una notita: «Gracias por pensar en los demás. Melchor, Gaspar y Baltasar»."], "m": "Pensar en los demás también nos llena de alegría a nosotros.", "q": [["¿Qué quería pedir Valeria al principio?", "Una bicicleta", "Una muñeca", "Una pelota"], ["¿En quiénes se acordó Valeria?", "En su hermanito Tomás y su abuelita", "En sus amigos de la escuela", "En su perro"], ["¿Qué pidió Valeria para su abuela?", "Una cobija calientita", "Unos lentes", "Un pastel"], ["¿Dónde dejó Valeria su carta?", "En su zapato junto a la ventana", "Debajo de la almohada", "En el árbol de Navidad"]], "mg": [["cobija", "cobija", "manta gruesa para taparse del frío"], ["borró", "borrar", "quitar lo que estaba escrito"], ["notita", "nota", "mensaje corto escrito en un papel"], ["cariño", "cariño", "amor que sientes por alguien"]], "fr": [[33, "bicicleta", ["pelota", "muñeca"]], [87, "abuela", ["maestra", "vecina"]], [133, "demás", ["Reyes", "colores"]]], "en": {"t": "Valeria’s Letter to the Three Kings", "p": ["On January 5th, Valeria sat down to write her letter to the Three Kings: Melchior, Caspar and Balthazar. She really wanted to ask for a bicycle.", "But she remembered her little brother Tomás, who always played with a broken ball. And her grandma, who was cold in the mornings. Valeria thought for a while, erased the bicycle and wrote something else.", "“Dear Three Kings: this year I want to ask you for a new ball for Tomás and a warm blanket for my grandma. If you have anything left, a box of crayons for me. With love, Valeria.”", "She left the letter in her shoe by the window. The next morning, there was a ball, a blanket... and a box of crayons with a little note: “Thank you for thinking of others. Melchior, Caspar and Balthazar.”"], "m": "Thinking of others fills us with joy too."}}, {"id": "rosca", "t": "El muñequito de la rosca", "p": ["El 6 de enero, la familia de Diego se reunió para partir la rosca de Reyes. Era grande, redonda, con ate de colores y azúcar encima, y una taza de chocolate caliente para cada uno.", "«Adentro de la rosca hay un muñequito escondido», explicó mamá. «Quien lo encuentre, tendrá que invitar los tamales el 2 de febrero, Día de la Candelaria».", "Cada quien cortó su pedazo con cuidado. El tío Beto no encontró nada. La abuela tampoco. Diego mordió su pan y... ¡ahí estaba el muñequito! Todos aplaudieron y gritaron: «¡Diego invita los tamales!».", "Diego se preocupó: «Pero yo no sé hacer tamales». La abuela lo abrazó: «No te preocupes, los hacemos juntos, como en Nochebuena». Y así, la fiesta ya tenía fecha para volver a reunirse."], "m": "Las tradiciones son un pretexto para volver a estar juntos.", "q": [["¿Qué tenía la rosca encima?", "Ate de colores y azúcar", "Chocolate y fresas", "Crema batida"], ["¿Qué tiene que hacer quien encuentra el muñequito?", "Invitar los tamales el 2 de febrero", "Lavar los platos", "Cantar una canción"], ["¿Quién encontró el muñequito?", "Diego", "El tío Beto", "La abuela"], ["¿Qué le dijo la abuela a Diego?", "Que harían los tamales juntos", "Que comprara los tamales", "Que ella los haría sola"]], "mg": [["rosca", "rosca", "pan redondo con un hueco en medio, como un aro"], ["candelaria", "Candelaria", "fiesta del 2 de febrero en la que se comen tamales"], ["ate", "ate", "dulce de fruta, como de membrillo o guayaba"], ["preocupó", "preocuparse", "sentir miedo de que algo salga mal"]], "fr": [[20, "Reyes", ["Navidad", "Pascua"]], [47, "escondido", ["dormido", "perdido"]], [98, "tamales", ["dulces", "juguetes"]]], "en": {"t": "The Little Doll in the Rosca", "p": ["On January 6th, Diego’s family got together to cut the rosca de Reyes. It was big and round, with colorful fruit paste and sugar on top, and a cup of hot chocolate for everyone.", "“Inside the rosca there is a little hidden doll,” explained Mom. “Whoever finds it will have to treat everyone to tamales on February 2nd, Candelaria Day.”", "Everyone cut their piece carefully. Uncle Beto found nothing. Grandma didn’t either. Diego bit into his bread and... there was the little doll! Everyone clapped and shouted: “Diego is buying the tamales!”", "Diego got worried: “But I don’t know how to make tamales.” Grandma hugged him: “Don’t worry, we’ll make them together, like on Christmas Eve.” And so, the party already had a date to get together again."], "m": "Traditions are a reason to be together again."}}, {"id": "uvas", "t": "Las doce uvas de Sofía", "p": ["El 31 de diciembre, la familia de Sofía preparó la cena de Año Nuevo. Antes de las doce de la noche, la mamá le dio a cada uno un platito con doce uvas.", "«Con cada campanada del reloj, te comes una uva y pides un deseo», le explicó. «Son doce, una por cada mes del año que empieza».", "Sofía pensó en sus deseos con mucho cuidado: aprender a andar en bici, que su perro Canelo se aliviara, sacar buenas notas, leer más cuentos... y otros más. Cuando el reloj empezó a sonar, se comió las uvas tan rápido que casi se atraganta y todos se rieron.", "Después de la última campanada, todos se abrazaron: «¡Feliz Año Nuevo!». Su papá le dijo: «Los deseos se cumplen más fácil si los ayudamos con esfuerzo cada día». Y Sofía escribió sus doce deseos en una hoja para no olvidarlos."], "m": "Un deseo se vuelve realidad cuando trabajamos un poquito por él cada día.", "q": [["¿Cuántas uvas había en cada platito?", "Doce", "Diez", "Cinco"], ["¿Qué se hace con cada uva?", "Se pide un deseo", "Se canta una canción", "Se da un abrazo"], ["¿Qué le pasó a Sofía al comer las uvas?", "Se las comió tan rápido que casi se atraganta", "No le gustaron", "Se le cayeron al suelo"], ["¿Qué hizo Sofía para no olvidar sus deseos?", "Los escribió en una hoja", "Se los contó a su perro", "Los dibujó en la pared"]], "mg": [["campanada", "campanada", "cada golpe de sonido de una campana o de un reloj"], ["esfuerzo", "esfuerzo", "trabajo y ganas que pones para lograr algo"], ["atraganta", "atragantarse", "cuando la comida se atora en la garganta"], ["deseo", "deseo", "algo que quieres que pase"]], "fr": [[37, "uvas", ["manzanas", "galletas"]], [62, "empieza", ["termina", "duerme"]], [150, "olvidarlos", ["romperlos", "venderlos"]]], "en": {"t": "Sofía’s Twelve Grapes", "p": ["On December 31st, Sofía’s family made New Year’s dinner. Before midnight, Mom gave everyone a little plate with twelve grapes.", "“With each chime of the clock, you eat a grape and make a wish,” she explained. “There are twelve, one for each month of the year that is starting.”", "Sofía thought about her wishes very carefully: learning to ride a bike, her dog Canelo getting better, getting good grades, reading more stories... and more. When the clock began to chime, she ate the grapes so fast that she almost choked, and everyone laughed.", "After the last chime, everyone hugged: “Happy New Year!” Her dad told her: “Wishes come true more easily if we help them with effort every day.” And Sofía wrote her twelve wishes on a sheet of paper so she wouldn’t forget them."], "m": "A wish comes true when we work a little for it every day."}}]}};

    if (o.bien) { b.classList.add("ok"); acierto(); }
    else { b.classList.add("mal"); b.disabled = true; msg("Casi… piensa qué palabra tiene sentido 😉", "#b45309"); hablar("Casi. Intenta otra vez."); }
  });
  const bm = document.getElementById("fMic");
  if (bm) bm.onclick = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const r1 = new SR(); r1.lang = "es-MX"; r1.interimResults = false; r1.maxAlternatives = 5;
    callar(); bm.textContent = "👂 Te escucho…";
    r1.onresult = e => {
      const alts = [...e.results[0]].map(x => x.transcript);
      const oyo = alts.some(t => t.split(/\s+/).some(p => norm(p) === norm(ok)));
      intentos++;
      if (oyo) { const b = [...caja.querySelectorAll(".ops button")].find(x => norm(x.textContent) === norm(ok)); if (b) b.classList.add("ok"); acierto(); }
      else msg(`Escuché «${alts[0] || "…"}». ¡Intenta otra vez!`, "#b45309");
    };
    r1.onend = () => { if (bm.textContent.startsWith("👂")) bm.textContent = "🎤 Dila en voz alta"; };
    r1.onerror = () => { msg("No te escuché bien. Toca una respuesta.", "#b45309"); };
    try { r1.start(); } catch (e) {}
  };
  document.getElementById("pSalta").onclick = () => { msg(`Era «${ok}»`, "var(--c1)"); fin(false); };
}
function resumenFrases() {
  if (!FRS.length) return;
  const total = FRS.length, bien = aciertosF.filter(Boolean).length;
  const estrellas = bien === total ? 3 : bien >= total - 1 ? 2 : bien >= 1 ? 1 : 0;
  const r = document.getElementById("resultado"); r.style.display = "block";
  r.innerHTML = `<div class="estrellas">${"⭐".repeat(estrellas)}${"☆".repeat(3 - estrellas)}</div><b>Adivinaste ${bien} de ${total} palabras escondidas</b><br>
    <span class="dato">${estrellas === 3 ? "¡Eres un detective de palabras! 🕵️" : "¡Juega otra vez y verás que las adivinas todas!"}</span>`;
  r.scrollIntoView({ block: "center", behavior: "smooth" });
}

// ---------- Grábate y escúchate ----------
const gG = document.getElementById("gGrabar"), gM = document.getElementById("gMia"), gN = document.getElementById("gNarra"), gB = document.getElementById("gBajar"), gI = document.getElementById("gInfo");
let grab = null, trozos = [], urlMia = null, streamG = null, tG = 0;
const oyeMia = new Audio();
gG.onclick = async () => {
  if (grab && grab.state === "recording") { grab.stop(); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder) { gI.textContent = EN ? "Your browser can't record. Try Google Chrome." : "Tu navegador no permite grabar. Prueba con Google Chrome."; return; }
  parar(false); a.pause(); oyeMia.pause();
  try { streamG = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { gI.textContent = EN ? "I need permission to use the microphone." : "Necesito permiso del micrófono. Tócale a «Permitir» y vuelve a intentar."; return; }
  trozos = []; grab = new MediaRecorder(streamG);
  grab.ondataavailable = e => { if (e.data && e.data.size) trozos.push(e.data); };
  grab.onstop = () => {
    streamG.getTracks().forEach(t => t.stop());
    const tipo = grab.mimeType || "audio/webm";
    if (urlMia) URL.revokeObjectURL(urlMia);
    urlMia = URL.createObjectURL(new Blob(trozos, { type: tipo }));
    gG.classList.remove("rec"); gG.textContent = EN ? "🎙️ Record again" : "🎙️ Grabar otra vez";
    gM.style.display = gN.style.display = gB.style.display = "";
    gB.href = urlMia; gB.download = `mi-lectura-${id}.${tipo.includes("mp4") ? "m4a" : tipo.includes("ogg") ? "ogg" : "webm"}`;
    const seg = Math.round((Date.now() - tG) / 1000);
    gI.textContent = EN ? `Done! You recorded ${seg} seconds. Listen and compare with the narrator.` : `¡Listo! Grabaste ${seg} segundos. Escucha tu voz y compárala con la narradora.`;
  };
  tG = Date.now(); grab.start();
  gG.classList.add("rec"); gG.textContent = EN ? "⏹️ Stop recording" : "⏹️ Terminar grabación";
  gI.textContent = EN ? "Recording… read the story out loud." : "Grabando… lee el cuento en voz alta.";
};
gM.onclick = () => { a.pause(); if (urlMia) { oyeMia.src = urlMia; oyeMia.play().catch(() => {}); } };
gN.onclick = () => { oyeMia.pause(); a.currentTime = 0; a.play().catch(() => {}); };

// ---------- Álbum de estampas y diploma ----------
const estampas = () => leer(`album-${L.carpeta}`) || {};
function toast(t) { const e = document.getElementById("toast"); e.textContent = t; e.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => { e.style.display = "none"; }, 4000); }
function ganarEstampa() {
  const e = estampas(); if (e[id]) return;
  e[id] = new Date().toISOString().slice(0, 10); guardar(`album-${L.carpeta}`, e);
  const total = items.filter(x => e[x.id]).length;
  toast(total === items.length ? "🎓 ¡Juntaste todas las estampas! Ya puedes ver tu diploma" : `🎉 ¡Ganaste la estampa de «${f.t}»! (${total} de ${items.length})`);
  pintarAlbum();
}
function pintarAlbum() {
  const e = estampas(), tot = items.filter(x => e[x.id]).length, mg = Object.keys(leer("magicas-vistas") || {}).length;
  const el = document.getElementById("album");
  el.innerHTML = `<h2>🏆 Mi álbum de estampas</h2>
    <p class="sub"><b>${tot} de ${items.length}</b> estampas · ✨ <b>${mg}</b> palabras mágicas descubiertas<br>${tot < items.length ? `Termina de escuchar o de leer un cuento para ganar su estampa. ¡Junta las ${items.length} y gana tu diploma!` : "¡Completaste el álbum! 🎉 Escribe tu nombre y recibe tu diploma."}</p>
    <div class="estampas">${items.map((x, i) => e[x.id]
      ? `<a class="estampa" href="${enlace(i, EN)}" title="${esc(x.t)}"><img loading="lazy" src="${L.img.replace("{id}", x.id)}" alt="Estampa: ${esc(x.t)}"></a>`
      : `<a class="estampa no" href="${enlace(i, EN)}" title="${esc(x.t)}">${i + 1}</a>`).join("")}</div>
    ${tot === items.length ? `<div class="acc"><input id="dNombre" placeholder="Escribe tu nombre" maxlength="40" value="${esc(leer("lector-nombre") || "")}"><br><button id="dVer">🎓 Ver mi diploma</button><div id="dZona"></div></div>` : ""}`;
  const b = document.getElementById("dVer"); if (b) b.onclick = diploma;
}
async function diploma() {
  const inp = document.getElementById("dNombre"), nombre = (inp.value || "").trim();
  if (!nombre) { inp.focus(); toast("✏️ Escribe tu nombre para tu diploma"); return; }
  guardar("lector-nombre", nombre);
  try { await Promise.all([document.fonts.load('800 60px "Baloo 2"'), document.fonts.load('700 40px Nunito')]); } catch (e) {}
  const cv = document.createElement("canvas"); cv.width = 1650; cv.height = 1275; const g = cv.getContext("2d");
  g.fillStyle = "#fffdf7"; g.fillRect(0, 0, 1650, 1275);
  g.lineWidth = 28; g.strokeStyle = L.c1; g.strokeRect(40, 40, 1570, 1195);
  g.lineWidth = 8; g.strokeStyle = L.c2; g.strokeRect(88, 88, 1474, 1099);
  g.textAlign = "center";
  g.fillStyle = L.c1; g.font = '800 130px "Baloo 2", sans-serif'; g.fillText("DIPLOMA", 825, 280);
  g.fillStyle = L.c2; g.font = '800 66px "Baloo 2", sans-serif'; g.fillText("de Gran Lector", 825, 365);
  g.fillStyle = "#2a2430"; g.font = '700 42px Nunito, sans-serif'; g.fillText("Se otorga con mucho orgullo a", 825, 480);
  let tam = 112; const fuente = () => `800 ${tam}px "Baloo 2", sans-serif`; g.font = fuente();
  while (g.measureText(nombre).width > 1280 && tam > 48) { tam -= 6; g.font = fuente(); }
  g.fillStyle = L.c1; g.fillText(nombre, 825, 620);
  g.strokeStyle = "#c9bfb5"; g.lineWidth = 3; g.beginPath(); g.moveTo(320, 655); g.lineTo(1330, 655); g.stroke();
  g.fillStyle = "#2a2430"; g.font = '700 42px Nunito, sans-serif'; g.fillText(`por escuchar y leer los ${items.length} cuentos de`, 825, 750);
  g.fillStyle = L.c2; g.font = '800 54px "Baloo 2", sans-serif'; g.fillText("«" + L.nombre + "»", 825, 830);
  g.font = '92px "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif'; g.fillText("⭐ ⭐ ⭐", 825, 975);
  const hoy = new Date().toLocaleDateString("es-MX", { day: "numeric", month: "long", year: "numeric" });
  g.fillStyle = "#776c80"; g.font = '700 34px Nunito, sans-serif'; g.fillText(hoy + "   ·   Ediciones Guizar", 825, 1110);
  const url = cv.toDataURL("image/png");
  document.getElementById("dZona").innerHTML = `<img src="${url}" alt="Diploma de ${esc(nombre)}" style="width:100%;border-radius:10px;border:1px solid var(--line);margin-top:12px">
    <div class="grabar"><a href="${url}" download="diploma-${norm(nombre) || "lector"}.png">⬇️ Descargar diploma</a><button id="dImp">🖨️ Imprimir</button></div>`;
  document.getElementById("dImp").onclick = () => {
    const w = window.open(""); if (!w) { toast("Descarga el diploma y luego imprímelo"); return; }
    w.document.write(`<title>Diploma de ${esc(nombre)}</title><style>@page{size:letter landscape;margin:0}body{margin:0}img{width:100%;display:block}</style><img src="${url}" onload="setTimeout(function(){print()},300)">`);
    w.document.close();
  };
}

pintarLista(); pintarAlbum();
