<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lector de QR · Ediciones Guizar</title>
<meta name="description" content="Lee cualquier código QR con la cámara o desde una foto o captura de pantalla. Gratis, sin instalar nada y sin subir tus fotos a internet.">
<meta property="og:title" content="Lector de QR gratis">
<meta property="og:description" content="Lee códigos QR con la cámara o desde una foto o captura. Sin instalar nada.">
<meta name="theme-color" content="#c2410c">
<style>
:root{
  --bg:#fbf7f1;--card:#ffffff;--tx:#2a2420;--sub:#6f655d;--line:#ece3d8;
  --ac:#c2410c;--ac2:#fde7d9;--ok:#15803d;--ok2:#dcfce7;--warn:#a16207;--warn2:#fef3c7;--bad:#b91c1c;--bad2:#fee2e2;
  --sombra:0 1px 2px rgba(60,40,20,.06),0 6px 18px rgba(60,40,20,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17130f;--card:#221c17;--tx:#f4ede6;--sub:#b7aca1;--line:#3a3129;
  --ac:#fb923c;--ac2:#3b2416;--ok:#4ade80;--ok2:#14301f;--warn:#fcd34d;--warn2:#3a2f12;--bad:#f87171;--bad2:#3b1515;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35);
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);line-height:1.45}
.envoltura{max-width:560px;margin:0 auto;padding:0 16px 40px}
header{text-align:center;padding:28px 0 8px}
h1{margin:0;font-size:1.8rem;color:var(--ac)}
header p{margin:6px 0 0;color:var(--sub)}
.acciones{display:grid;gap:12px;margin:22px 0}
.grande{display:flex;align-items:center;gap:14px;width:100%;border:0;border-radius:16px;padding:18px;font:inherit;font-size:1.08rem;font-weight:700;cursor:pointer;text-align:left;box-shadow:var(--sombra)}
.grande span.ico{font-size:2rem;line-height:1}
.grande small{display:block;font-weight:400;font-size:.85rem;opacity:.85}
.camara{background:var(--ac);color:#fff}
.foto{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.grande:active{transform:scale(.98)}
.pista{color:var(--sub);font-size:.88rem;text-align:center;margin:0}
.caja{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--sombra);margin-top:16px}
#visor{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:3/4;margin-top:16px}
#visor video{width:100%;height:100%;object-fit:cover;display:block}
#visor .marco{position:absolute;inset:18%;border:3px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
#visor .estado{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#fff;font-weight:600;text-shadow:0 1px 3px #000}
#cerrarCam{position:absolute;top:10px;right:10px;border:0;border-radius:999px;padding:8px 14px;font:inherit;font-weight:700;background:rgba(0,0,0,.6);color:#fff;cursor:pointer}
#miniatura{width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:var(--bg);display:block}
.tipo{display:inline-block;font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--ac2);color:var(--ac)}
.contenido{font-size:1.05rem;font-weight:600;word-break:break-all;margin:10px 0 4px;white-space:pre-wrap}
.dominio{font-size:.95rem;color:var(--sub);margin:0 0 10px}
.dominio b{color:var(--tx)}
.aviso{border-radius:12px;padding:10px 12px;font-size:.9rem;margin:10px 0}
.aviso.ok{background:var(--ok2);color:var(--ok)}
.aviso.warn{background:var(--warn2);color:var(--warn)}
.aviso.bad{background:var(--bad2);color:var(--bad)}
.botones{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.botones a,.botones button{flex:1 1 140px;display:inline-flex;justify-content:center;align-items:center;gap:6px;min-height:46px;border-radius:12px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:8px 12px}
.botones .principal{background:var(--ac);color:#fff;border-color:transparent}
.error{color:var(--bad);font-weight:600}
.historial h2{font-size:1rem;margin:26px 0 8px;color:var(--sub)}
.historial ul{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.historial li button{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 12px;font:inherit;cursor:pointer;word-break:break-all}
.historial li small{display:block;color:var(--sub)}
#borrarHist{border:0;background:none;color:var(--sub);text-decoration:underline;font:inherit;cursor:pointer;margin-top:8px}
footer{text-align:center;color:var(--sub);font-size:.82rem;margin-top:34px}
</style>
</head>
<body>
<div class="envoltura">
  <header>
    <h1>🔍 Lector de QR</h1>
    <p>Lee cualquier QR con la cámara o desde una foto o captura de pantalla.</p>
  </header>

  <div class="acciones">
    <button class="grande camara" id="btnCamara" type="button"><span class="ico">📷</span><span>Escanear con la cámara<small>Apunta al código y se lee solo</small></span></button>
    <button class="grande foto" id="btnFoto" type="button"><span class="ico">🖼️</span><span>Leer QR de una foto o captura<small>Escoge una imagen de tu galería</small></span></button>
    <input id="archivo" type="file" accept="image/*" hidden>
    <p class="pista">Tus fotos no se suben a internet: el código se lee aquí mismo, en tu celular.</p>
  </div>

  <div id="visor" hidden>
    <video id="video" playsinline muted></video>
    <div class="marco"></div>
    <div class="estado" id="estadoCam">Buscando un código QR…</div>
    <button id="cerrarCam" type="button">✕ Cerrar</button>
  </div>

  <div class="caja" id="resultado" hidden>
    <img id="miniatura" alt="Imagen que escogiste" hidden>
    <div id="salida"></div>
  </div>

  <section class="historial" id="historial" hidden>
    <h2>Últimos códigos leídos (solo en este celular)</h2>
    <ul id="listaHist"></ul>
    <button id="borrarHist" type="button">Borrar historial</button>
  </section>

  <footer>Ediciones Guizar · Herramienta gratuita</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------- Lectura de QR ----------
// 1) Si el navegador trae lector propio (Chrome en Android), se usa ese: es rápido y encuentra varios códigos.
// 2) Si no, se usa jsQR: se prueba la imagen completa a varios tamaños y luego por pedazos,
//    para encontrar códigos pequeños dentro de una foto o captura grande.
let detectorNativo = null;
async function prepararDetector() {
  try {
    if ("BarcodeDetector" in window) {
      const formatos = await BarcodeDetector.getSupportedFormats();
      if (formatos.includes("qr_code")) detectorNativo = new BarcodeDetector({ formats: ["qr_code"] });
    }
  } catch (e) { detectorNativo = null; }
}
const listo = prepararDetector();

function leerConJsQR(fuente, sx, sy, sw, sh, ancho) {
  if (typeof jsQR !== "function") return null;
  const escala = Math.min(1, ancho / Math.max(sw, sh));
  const w = Math.max(1, Math.round(sw * escala)), h = Math.max(1, Math.round(sh * escala));
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d", { willReadFrequently: true });
  x.imageSmoothingEnabled = true;
  x.drawImage(fuente, sx, sy, sw, sh, 0, 0, w, h);
  const datos = x.getImageData(0, 0, w, h);
  const r = jsQR(datos.data, w, h, { inversionAttempts: "attemptBoth" });
  return r && r.data ? r.data : null;
}

async function leerImagen(img) {
  await listo;
  const W = img.naturalWidth || img.videoWidth || img.width, H = img.naturalHeight || img.videoHeight || img.height;
  if (detectorNativo) {
    try {
      const encontrados = await detectorNativo.detect(img);
      const textos = [...new Set(encontrados.map((e) => e.rawValue).filter(Boolean))];
      if (textos.length) return textos;
    } catch (e) {}
  }
  // Imagen completa a varios tamaños
  for (const ancho of [800, 1200, 1600, 500]) {
    const t = leerConJsQR(img, 0, 0, W, H, ancho);
    if (t) return [t];
  }
  // Por pedazos (cuadrículas de 2x2 y 3x3, encimadas) para QR pequeños dentro de la foto
  for (const n of [2, 3]) {
    const pw = W / n * 1.5, ph = H / n * 1.5;
    for (let fila = 0; fila < n; fila++) for (let col = 0; col < n; col++) {
      const sx = Math.max(0, Math.min(W - pw, (W / n) * col - pw * 0.17));
      const sy = Math.max(0, Math.min(H - ph, (H / n) * fila - ph * 0.17));
      const t = leerConJsQR(img, sx, sy, Math.min(pw, W), Math.min(ph, H), 900);
      if (t) return [t];
    }
  }
  return [];
}

// ---------- Qué dice el código ----------
const ACORTADORES = /^(bit\.ly|tinyurl\.com|t\.co|goo\.gl|is\.gd|cutt\.ly|ow\.ly|rebrand\.ly|shorturl\.at|rb\.gy|s\.id|tiny\.cc|t\.ly)$/i;
function analizar(texto) {
  const t = texto.trim();
  if (/^https?:\/\//i.test(t)) {
    let u; try { u = new URL(t); } catch (e) { return { tipo: "Texto", texto: t }; }
    const host = u.hostname.replace(/^www\./, "");
    if (/^(wa\.me|api\.whatsapp\.com|chat\.whatsapp\.com)$/i.test(u.hostname)) {
      const num = (u.pathname.match(/\d{8,15}/) || [u.searchParams.get("phone") || ""])[0];
      const msj = u.searchParams.get("text");
      return { tipo: "WhatsApp", texto: t, url: t, host, detalle: (num ? "Número: +" + num : "Grupo o enlace de WhatsApp") + (msj ? "\nMensaje: " + msj : ""), seguro: u.protocol === "https:" };
    }
    const avisos = [];
    let nivel = "ok";
    if (u.protocol !== "https:") { avisos.push("La página no usa conexión segura (https). No escribas contraseñas ni datos de tarjeta ahí."); nivel = "warn"; }
    if (ACORTADORES.test(u.hostname)) { avisos.push("Es un enlace acortado: no se sabe a qué página lleva hasta abrirlo."); nivel = "warn"; }
    if (/^\d{1,3}(\.\d{1,3}){3}$/.test(u.hostname)) { avisos.push("El enlace usa números en lugar de un nombre de página. Ten cuidado."); nivel = "bad"; }
    if (/xn--/i.test(u.hostname)) { avisos.push("El nombre de la página usa letras especiales que pueden imitar a otra. Revisa bien."); nivel = "bad"; }
    if (u.username || u.password || /@/.test(u.host)) { avisos.push("El enlace trae una arroba (@) para engañar: la página real es otra. No lo abras."); nivel = "bad"; }
    return { tipo: "Enlace", texto: t, url: t, host, avisos, nivel };
  }
  if (/^tel:/i.test(t)) return { tipo: "Teléfono", texto: t, url: t, detalle: t.slice(4) };
  if (/^(sms|smsto):/i.test(t)) return { tipo: "Mensaje SMS", texto: t, url: t.replace(/^smsto:/i, "sms:"), detalle: t.replace(/^(sms|smsto):/i, "") };
  if (/^mailto:/i.test(t)) return { tipo: "Correo", texto: t, url: t, detalle: t.slice(7).split("?")[0] };
  if (/^WIFI:/i.test(t)) {
    const campo = (k) => { const m = t.match(new RegExp("[;:]" + k + ":((?:\\\\.|[^;])*)", "i")); return m ? m[1].replace(/\\(.)/g, "$1") : ""; };
    return { tipo: "Red WiFi", texto: t, wifi: { red: campo("S"), clave: campo("P"), seg: campo("T") || "abierta" } };
  }
  if (/^BEGIN:VCARD/i.test(t)) {
    const nombre = (t.match(/\nFN:(.*)/i) || [, ""])[1].trim();
    const tel = (t.match(/\nTEL[^:]*:(.*)/i) || [, ""])[1].trim();
    const correo = (t.match(/\nEMAIL[^:]*:(.*)/i) || [, ""])[1].trim();
    return { tipo: "Contacto", texto: t, detalle: [nombre && "Nombre: " + nombre, tel && "Teléfono: " + tel, correo && "Correo: " + correo].filter(Boolean).join("\n") || t, tel };
  }
  if (/^geo:/i.test(t)) { const c = t.slice(4).split("?")[0]; return { tipo: "Ubicación", texto: t, url: "https://maps.google.com/?q=" + encodeURIComponent(c), detalle: c }; }
  if (/^[\w.-]+\.(com|mx|net|org|io|app|me|store|shop|com\.mx)(\/\S*)?$/i.test(t)) return analizar("https://" + t);
  return { tipo: "Texto", texto: t };
}

function pintarResultado(textos) {
  const salida = $("salida");
  if (!textos.length) {
    salida.innerHTML = `<p class="error">No encontré un código QR en esta imagen.</p>
      <p class="pista" style="text-align:left">Prueba con una foto más cercana y enfocada, que el código se vea completo y con buena luz. Si es una captura de pantalla, recórtala para que el QR se vea más grande.</p>`;
    return;
  }
  salida.innerHTML = textos.map((t, i) => tarjeta(analizar(t), i)).join("");
  textos.forEach((t) => guardarHistorial(t));
  salida.querySelectorAll("[data-copiar]").forEach((b) => b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.dataset.copiar); b.textContent = "✅ Copiado"; }
    catch (e) { b.textContent = "Mantén presionado el texto para copiarlo"; }
  });
  salida.querySelectorAll("[data-compartir]").forEach((b) => b.onclick = async () => {
    try { await navigator.share({ text: b.dataset.compartir }); } catch (e) {}
  });
}

function tarjeta(a, i) {
  const titulo = `<span class="tipo">${esc(a.tipo)}</span>`;
  const compartir = navigator.share ? `<button type="button" data-compartir="${esc(a.texto)}">📤 Compartir</button>` : "";
  let cuerpo = "";
  if (a.tipo === "Enlace") {
    const avisos = a.avisos.length ? a.avisos.map((x) => `<div class="aviso ${a.nivel}">⚠️ ${esc(x)}</div>`).join("") : `<div class="aviso ok">✅ Enlace con conexión segura. Revisa que el nombre de la página sea el que esperas.</div>`;
    cuerpo = `<p class="contenido">${esc(a.texto)}</p><p class="dominio">Te lleva a: <b>${esc(a.host)}</b></p>${avisos}
      <div class="botones"><a class="principal" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">🌐 Abrir página</a>
      <button type="button" data-copiar="${esc(a.texto)}">📋 Copiar</button>${compartir}</div>`;
  } else if (a.tipo === "WhatsApp") {
    cuerpo = `<p class="contenido">${esc(a.detalle)}</p>
      <div class="botones"><a class="principal" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">💬 Abrir WhatsApp</a>
      <button type="button" data-copiar="${esc(a.texto)}">📋 Copiar</button>${compartir}</div>`;
  } else if (a.tipo === "Red WiFi") {
    const w = a.wifi;
    cuerpo = `<p class="contenido">Red: ${esc(w.red || "(sin nombre)")}\nContraseña: ${esc(w.clave || "(sin contraseña)")}</p>
      <p class="pista" style="text-align:left">Copia la contraseña y pégala al conectarte a la red “${esc(w.red)}” en los ajustes de WiFi.</p>
      <div class="botones">${w.clave ? `<button class="principal" type="button" data-copiar="${esc(w.clave)}">🔑 Copiar contraseña</button>` : ""}</div>`;
  } else if (a.tipo === "Contacto") {
    cuerpo = `<p class="contenido">${esc(a.detalle)}</p><div class="botones">${a.tel ? `<a class="principal" href="tel:${esc(a.tel)}">📞 Llamar</a>` : ""}<button type="button" data-copiar="${esc(a.texto)}">📋 Copiar</button></div>`;
  } else if (a.url) {
    const icono = { "Teléfono": "📞 Llamar", "Mensaje SMS": "✉️ Enviar SMS", "Correo": "📧 Escribir correo", "Ubicación": "📍 Ver en el mapa" }[a.tipo] || "Abrir";
    cuerpo = `<p class="contenido">${esc(a.detalle || a.texto)}</p><div class="botones"><a class="principal" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">${icono}</a><button type="button" data-copiar="${esc(a.detalle || a.texto)}">📋 Copiar</button></div>`;
  } else {
    cuerpo = `<p class="contenido">${esc(a.texto)}</p><div class="botones"><button class="principal" type="button" data-copiar="${esc(a.texto)}">📋 Copiar texto</button>${compartir}</div>`;
  }
  return `<div style="${i ? "margin-top:18px;padding-top:16px;border-top:1px solid var(--line)" : "margin-top:12px"}">${titulo}${cuerpo}</div>`;
}

// ---------- Desde una foto ----------
$("btnFoto").onclick = () => { pararCamara(); $("archivo").click(); };
$("archivo").onchange = (e) => {
  const f = e.target.files && e.target.files[0];
  e.target.value = "";
  if (f) leerArchivo(f);
};
function leerArchivo(f) {
  if (!/^image\//.test(f.type || "image/")) return;
  const url = URL.createObjectURL(f);
  const img = new Image();
  img.onload = async () => {
    $("resultado").hidden = false;
    $("miniatura").src = url; $("miniatura").hidden = false;
    $("salida").innerHTML = `<p class="pista" style="text-align:left">Buscando el código QR…</p>`;
    pintarResultado(await leerImagen(img));
    $("resultado").scrollIntoView({ behavior: "smooth", block: "start" });
  };
  img.onerror = () => { $("resultado").hidden = false; $("miniatura").hidden = true; $("salida").innerHTML = `<p class="error">No se pudo abrir esa imagen.</p>`; };
  img.src = url;
}
// También se puede pegar una captura (en computadora: Ctrl+V)
window.addEventListener("paste", (e) => {
  const item = [...(e.clipboardData?.items || [])].find((i) => i.type.startsWith("image/"));
  if (item) leerArchivo(item.getAsFile());
});

// ---------- Con la cámara ----------
let flujo = null, buscando = false;
$("btnCamara").onclick = async () => {
  if (!navigator.mediaDevices?.getUserMedia) {
    mostrarError("Tu navegador no permite usar la cámara aquí. Usa «Leer QR de una foto o captura».");
    return;
  }
  try {
    flujo = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  } catch (e) {
    mostrarError("No se pudo abrir la cámara. Revisa que le diste permiso a esta página, o usa «Leer QR de una foto o captura».");
    return;
  }
  const v = $("video"); v.srcObject = flujo; await v.play();
  $("visor").hidden = false; $("resultado").hidden = true;
  $("estadoCam").textContent = "Buscando un código QR…";
  $("visor").scrollIntoView({ behavior: "smooth", block: "start" });
  buscando = true; buscarEnVideo();
};
async function buscarEnVideo() {
  if (!buscando) return;
  const v = $("video");
  if (v.readyState >= 2 && v.videoWidth) {
    let textos = [];
    await listo;
    if (detectorNativo) { try { textos = [...new Set((await detectorNativo.detect(v)).map((e) => e.rawValue).filter(Boolean))]; } catch (e) {} }
    else { const t = leerConJsQR(v, 0, 0, v.videoWidth, v.videoHeight, 640); if (t) textos = [t]; }
    if (textos.length) {
      if (navigator.vibrate) navigator.vibrate(120);
      pararCamara();
      $("resultado").hidden = false; $("miniatura").hidden = true;
      pintarResultado(textos);
      return;
    }
  }
  setTimeout(() => requestAnimationFrame(buscarEnVideo), 180);
}
function pararCamara() {
  buscando = false;
  if (flujo) { flujo.getTracks().forEach((t) => t.stop()); flujo = null; }
  $("visor").hidden = true;
}
$("cerrarCam").onclick = pararCamara;
function mostrarError(msg) {
  $("resultado").hidden = false; $("miniatura").hidden = true;
  $("salida").innerHTML = `<p class="error">${esc(msg)}</p>`;
}

// ---------- Historial (solo en este celular) ----------
function leerHist() { try { return JSON.parse(localStorage.getItem("lectorqr_hist") || "[]"); } catch (e) { return []; } }
function guardarHistorial(t) {
  const h = leerHist().filter((x) => x.t !== t);
  h.unshift({ t, f: Date.now() });
  try { localStorage.setItem("lectorqr_hist", JSON.stringify(h.slice(0, 10))); } catch (e) {}
  pintarHistorial();
}
function pintarHistorial() {
  const h = leerHist();
  $("historial").hidden = !h.length;
  $("listaHist").innerHTML = h.map((x, i) => `<li><button type="button" data-i="${i}">${esc(x.t.length > 90 ? x.t.slice(0, 90) + "…" : x.t)}<small>${new Date(x.f).toLocaleString("es-MX", { dateStyle: "short", timeStyle: "short" })}</small></button></li>`).join("");
  $("listaHist").querySelectorAll("button").forEach((b) => b.onclick = () => {
    $("resultado").hidden = false; $("miniatura").hidden = true;
    pintarResultado([h[+b.dataset.i].t]);
    $("resultado").scrollIntoView({ behavior: "smooth", block: "start" });
  });
}
$("borrarHist").onclick = () => { try { localStorage.removeItem("lectorqr_hist"); } catch (e) {} pintarHistorial(); };
pintarHistorial();
</script>
</body>
</html>
