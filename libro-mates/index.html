.ej{border:2.5px solid var(--tx);border-radius:14px;padding:.6rem .7rem;display:flex;flex-direction:column;gap:.45rem;break-inside:avoid}
.ej p{font-size:.98rem}
.fila{display:flex;flex-wrap:wrap;gap:.1rem .15rem;align-items:center;font-size:1.55rem;line-height:1.15}
.it{display:inline-block;position:relative}

.linea{display:inline-block;flex:1;min-width:4rem;border-bottom:2.5px solid var(--tx);height:1.5rem}
.cierre{margin-top:.6rem;text-align:center;font-weight:800;font-size:1.15rem;color:var(--c3)}
.portada{text-align:center;padding:2.2rem 1.2rem;border-color:var(--c2)}

.clave h2{margin-bottom:.4rem}
.clave p{margin:.25rem 0;font-size:.95rem}
.aviso{max-width:8.5in;margin:2rem auto;text-align:center;color:var(--mu)}
.svgtr{width:100%;height:auto;display:block}
.libre{border:2.5px dashed #9aa3b2;border-radius:12px;height:92px;position:relative;background:#fff}
.libre.grande{height:150px}
.libre.mini{height:62px}
.libre::before{content:"";position:absolute;left:9px;top:9px;width:9px;height:9px;border-radius:50%;background:#22b573}
.ahora{font-size:.8rem;color:var(--mu);font-weight:700;margin-top:.15rem}
.swatch{display:inline-block;width:1rem;height:1rem;border-radius:50%;border:2px solid var(--tx);vertical-align:-2px;margin-right:.3rem}
@page{size:letter;margin:10mm}
@media print{

function emojiDe(palabra){
  const p=quitar(palabra);
  if(!p||STOP.has(p)) return null;
  for(const [k,e] of EMOJI){ if(p===k||p.startsWith(k)&&p.length<=k.length+3) return e; }
  return null;
}
const NUMEROS={un:1,una:1,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10};
function grupos(texto){
  const out=[];
  const re=/(\d+|\bun\b|\buna\b|\buno\b|\bdos\b|\btres\b|\bcuatro\b|\bcinco\b|\bseis\b|\bsiete\b|\bocho\b|\bnueve\b|\bdiez\b)\s+(?:de\s+)?([a-záéíóúñü]+)(?:\s+([a-záéíóúñü]+))?/gi;
  let m;
  while((m=re.exec(texto||''))){
    let e=emojiDe(m[2]);
    if(!e&&m[3]) e=emojiDe(m[3]);
    const n=/^\d+$/.test(m[1])?Number(m[1]):NUMEROS[quitar(m[1])];
    if(e&&n) out.push({n:Math.min(n,30),e});
  }
  return out;
}
function rep(em,n,cls){
  n=Math.max(0,Math.min(Number(n)||0,30));
  let s='';
  for(let i=0;i<n;i++) s+=`<span class="it${cls?' '+cls:''}">${em}</span>`;
  return s;
}
function monedas(texto){
  const re=/(\d+)\s+monedas?\s+de\s+\$?\s*(\d+)/gi;
  let m,html='',hay=false;
  while((m=re.exec(texto||''))){
    hay=true;
    const n=Math.min(Number(m[1]),20);
    for(let i=0;i<n;i++) html+=`<span class="moneda">${esc(m[2])}</span>`;
    html+='<span class="sep"></span>';
  }
  return hay?`<div class="fila">${html}</div>`:'';
}
function reloj(h){
  h=((Number(h)%12)||12);
  const ang=(h%12)*30;
  const marcas=Array.from({length:12},(_,i)=>{
    const a=i*30*Math.PI/180;
    return `<line x1="${50+38*Math.sin(a)}" y1="${50-38*Math.cos(a)}" x2="${50+44*Math.sin(a)}" y2="${50-44*Math.cos(a)}" stroke="#1f2430" stroke-width="2.5"/>`;
  }).join('');
  const nums=[12,3,6,9].map((n,i)=>{
    const a=i*90*Math.PI/180;
    return `<text x="${50+30*Math.sin(a)}" y="${50-30*Math.cos(a)+4}" text-anchor="middle" font-size="11" font-weight="800" fill="#1f2430">${n}</text>`;
  }).join('');
  const hr=ang*Math.PI/180;
  return `<svg viewBox="0 0 100 100" width="110" height="110" role="img" aria-label="Reloj marcando las ${h} en punto"><circle cx="50" cy="50" r="46" fill="#fff" stroke="#1f2430" stroke-width="4"/>${marcas}${nums}<line x1="50" y1="50" x2="${50+22*Math.sin(hr)}" y2="${50-22*Math.cos(hr)}" stroke="#ff7a59" stroke-width="5" stroke-linecap="round"/><line x1="50" y1="50" x2="50" y2="14" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/><circle cx="50" cy="50" r="3.5" fill="#1f2430"/></svg>`;
}

}

}
function rejilla(ox,oy){
  let s='';
  for(let i=0;i<=7;i++) s+=`<line x1="${ox+8*i}" y1="${oy}" x2="${ox+8*i}" y2="${oy+40}" stroke="#c9ced8" stroke-width=".6"/>`;
  for(let j=0;j<=5;j++) s+=`<line x1="${ox}" y1="${oy+8*j}" x2="${ox+56}" y2="${oy+8*j}" stroke="#c9ced8" stroke-width=".6"/>`;
  return s;
}
function copiaHTML(f){
  const pts=COPIA[f];
  const lin=pts?`<polyline points="${pts.map(p=>(2+p[0]*8)+','+(4+p[1]*8)).join(' ')}" fill="none" stroke="#ff7a59" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`:'';
  return `<svg class="svgtr" viewBox="0 0 120 48" role="img" aria-label="Dos cuadrículas: copia la figura de la izquierda en la derecha">${rejilla(2,4)}${rejilla(62,4)}${lin}</svg>`;
}
function simetriaHTML(f){
  const pts=MITAD[f]; if(!pts) return '';
  return `<svg class="svgtr" viewBox="0 0 120 70" role="img" aria-label="Mitad de una figura para completar"><line x1="60" y1="2" x2="60" y2="68" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3 3"/><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#1f2430" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function coloreaHTML(f,color){
  const forma=FORMAS[f]; if(!forma) return '';
  const c=COLORES[color]||'#cccccc';
  return `<svg class="svgtr" style="max-height:130px" viewBox="0 0 70 70" role="img" aria-label="Forma para colorear"><g fill="#fff" stroke="#1f2430" stroke-width="2.6" stroke-linejoin="round">${forma}</g></svg><div class="ahora"><span class="swatch" style="background:${c}"></span>${esc(color||'')}</div>`;
}
function lienzoHTML(e){
  const gs=grupos(e.dibujo||'');
  const modelo=gs.length?`<div class="ahora">Mira:</div><div class="fila">${gs.map(g=>rep(g.e,g.n)).join('<span class="sep"></span>')}</div>`:'';
  return `${modelo}<div class="libre${e.alto==='grande'?' grande':''}"></div>`;
}
function visualHTML(e){
  switch(e.tipo){
    case 'traza': return trazaHTML(e.figura);
    case 'puntos': return puntosHTML(e.figura);
    case 'copia': return copiaHTML(e.figura);
    case 'simetria': return simetriaHTML(e.figura);
    case 'colorea': return coloreaHTML(e.figura,e.color);
    case 'lienzo': return lienzoHTML(e);
    default: return '';
  }
}
function ejercicioHTML(e){
  if(e.tipo) return `<div class="ej"><p>${esc(e.enunciado)}</p>${visualHTML(e)}</div>`;
  const a=Number(e.a),b=Number(e.b);
  const aritm=e.a!==null&&e.a!==undefined&&e.b!==null&&e.b!==undefined&&Number.isFinite(a)&&Number.isFinite(b)&&(e.op==='+'||e.op==='-');
  const resp=aritm
    ? `<div class="resp">${a} ${e.op==='-'?'−':'+'} ${b} = <span class="caja"></span></div>`
    : `<div class="resp">Respuesta: <span class="linea"></span></div>`;
  return `<div class="ej"><p>${esc(e.enunciado)}</p>${dibujoHTML(e)}${resp}</div>`;
}
function hojaHTML(p){
  const c=p.contenido||{};
  const secs=(c.secciones||[]).map((s,i)=>`<section class="sec"><h3><i>${i+1}</i><span>${esc(s.consigna)}</span></h3><div class="ejs">${(s.ejercicios||[]).map(ejercicioHTML).join('')}</div></section>`).join('');
  return `<article class="hoja"><header class="cab"><span class="num">Hoja ${p.numero}</span><h2>${esc(c.titulo||p.titulo||'')}</h2></header><div class="datos"><span>Nombre:</span><span>Fecha:</span></div>${secs}<div class="cierre">😊 ${esc(c.cierre||'¡Muy bien!')}</div></article>`;
}
function portadaHTML(info){
  const i=info||{};
  return `<article class="hoja portada"><div class="gran">${esc(i.emoji_portada||'📘 ⭐')}</div><h1>${esc(i.titulo||'Mi cuaderno')}</h1><p>${esc(i.subtitulo||'Primer grado de primaria')}</p><div class="datos"><span>Nombre:</span><span>Grupo:</span></div></article>`;
}
function claveHTML(paginas){
  const hay=paginas.some(p=>(p.respuestas||[]).some(s=>(s||[]).some(x=>String(x).trim())));
  if(!hay) return '';
  const filas=paginas.map(p=>{
    const r=p.respuestas||[];
    const t=r.map((s,i)=>`Sección ${i+1}: ${esc((s||[]).join(', '))}`).join(' · ');
    return `<p><b>Hoja ${p.numero}.</b> ${t}</p>`;
  }).join('');
  return `<article class="hoja clave"><header class="cab"><span class="num">Adulto</span><h2>Clave de respuestas</h2></header>${filas}</article>`;
}
async function cargar(){
  const est=document.getElementById('estado'),cont=document.getElementById('libro');
  const cab={apikey:KEY,Authorization:'Bearer '+KEY};
  try{
    const urlP=`${URL_SB}/rest/v1/libro_paginas?select=numero,titulo,contenido,respuestas&libro=eq.${LIBRO}&order=numero.asc`;
    const urlI=`${URL_SB}/rest/v1/libro_info?select=titulo,subtitulo,emoji_portada&libro=eq.${LIBRO}`;
    const [rp,ri]=await Promise.all([fetch(urlP,{headers:cab}),fetch(urlI,{headers:cab}).catch(()=>null)]);
    if(!rp.ok) throw new Error('HTTP '+rp.status);
    let info=null;
    try{ if(ri&&ri.ok){const a=await ri.json(); info=a&&a[0]||null} }catch(e){}
    if(info&&info.titulo){document.title=info.titulo+' · 1.º de primaria';document.getElementById('tituloBarra').textContent=(info.emoji_portada?info.emoji_portada.split(' ')[0]+' ':'')+info.titulo}
    const filas=(await rp.json()).filter(p=>p&&p.contenido);
    if(!filas.length){est.textContent='Todavía no hay hojas listas';cont.innerHTML='<p class="aviso">Las hojas se están preparando. Vuelve en unos minutos.</p>';return}
    cont.innerHTML=portadaHTML(info)+filas.map(hojaHTML).join('')+claveHTML(filas);
    est.textContent=filas.length+' hojas listas';
  }catch(e){
    est.textContent='No se pudo cargar';
    cont.innerHTML='<p class="aviso">No se pudo cargar el cuaderno. Revisa tu conexión e inténtalo de nuevo.</p>';
  }
}
cargar();
</script>
